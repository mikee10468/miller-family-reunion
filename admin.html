<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Admin · Miller Family</title>
  <meta name="theme-color" content="#3B0A58" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    .wrap { max-width: 920px; margin: 0 auto; padding: 1.4rem 1rem calc(2rem + env(safe-area-inset-bottom,0px)); }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem; background: linear-gradient(160deg, var(--purple-900), var(--purple-600)); color:#fff; padding: calc(env(safe-area-inset-top,0px) + 1rem) 1rem 1rem; }
    .topbar .brand { font-family:"Cinzel",serif; letter-spacing:.06em; }
    .topbar .script { font-family:"Great Vibes",cursive; color:var(--gold); font-size:1.8rem; }
    .tabs { display:flex; gap:.5rem; flex-wrap:wrap; margin:1.2rem 0; }
    .tab { border:0; cursor:pointer; font:inherit; font-family:"Cinzel",serif; padding:.55rem 1.1rem; border-radius:999px; background:#efe6f7; color:var(--purple-800); }
    .tab.active { background:var(--purple-700, #5a1e8c); color:#fff; background:linear-gradient(180deg,var(--purple-600),var(--purple-800)); }
    .count { display:inline-block; min-width:1.4em; text-align:center; background:var(--gold); color:#3a2a00; border-radius:999px; font-size:.75rem; padding:0 .4rem; margin-left:.4rem; }
    .list { display:grid; gap:.9rem; }
    .row { background:#fff; border:1px solid rgba(109,40,168,.12); border-radius:14px; padding:1rem 1.1rem; box-shadow:var(--shadow); }
    .row h3 { font-family:"Cinzel",serif; color:var(--purple-800); margin:0 0 .25rem; font-size:1.05rem; }
    .row .meta { color:#6b5b7a; font-size:.9rem; }
    .row .actions { display:flex; gap:.5rem; flex-wrap:wrap; margin-top:.8rem; align-items:center; }
    select { font:inherit; padding:.45rem .6rem; border-radius:10px; border:1px solid rgba(109,40,168,.3); background:#fff; color:var(--ink); }
    .pill { display:inline-block; border-radius:999px; padding:.15rem .6rem; font-size:.72rem; font-family:"Cinzel",serif; letter-spacing:.04em; }
    .pill.pending{background:#fff2cc;color:#8a6a00;} .pill.active{background:#d6f5d6;color:#1b6b1b;}
    .pill.approved{background:#d6f5d6;color:#1b6b1b;} .pill.denied,.pill.suspended{background:#f7d6d6;color:#8a1b1b;}
    .pill.admin{background:#e9d6f7;color:#5a1e8c;} .pill.elder{background:#d6e4f7;color:#1b4d8a;} .pill.member{background:#eee;color:#555;}
    .linkmsg{font-family:"Cinzel",serif;font-size:.78rem;margin-left:.4rem;color:#1b6b1b;}
    .filterbar{display:flex;align-items:center;gap:.5rem;margin:.2rem 0 .7rem;}
    .filterbar input{flex:1;max-width:420px;padding:.5rem .8rem;border-radius:999px;border:1px solid rgba(109,40,168,.3);font:inherit;}
    .filtercount{font-family:"Cinzel",serif;font-size:.78rem;color:#6b5b7a;}
    .empty { text-align:center; color:#6b5b7a; padding:2rem; font-family:"Cinzel",serif; }
    .notice { background:#fff8e6; border:1px solid var(--gold); border-radius:12px; padding:.9rem 1.1rem; margin-bottom:1rem; }
    .code { font-family:ui-monospace,Menlo,Consolas,monospace; background:#3B0A58; color:var(--gold-soft); padding:.3rem .6rem; border-radius:8px; letter-spacing:.08em; }
    .gate { max-width:460px; margin:3rem auto; text-align:center; }
  </style>
</head>
<body>
  <div class="topbar">
    <div><span class="script">Miller</span> <span class="brand">ADMIN</span></div>
    <div id="whoami" class="brand" style="font-size:.85rem;"></div>
  </div>

  <div class="wrap" id="wrap">
    <p class="empty">Loading…</p>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script>
    const wrap = document.getElementById("wrap");
    const who = document.getElementById("whoami");
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    const fmt = (d) => d ? new Date(d).toLocaleString() : "";
    let ME = null, TAB = "requests";
    let PERSON_BYID = {}, PROFILE_BYID = {};

    function gate(msg) {
      wrap.innerHTML = '<div class="gate"><h2>' + msg + '</h2>' +
        '<p><a class="btn btn--gold" href="login.html">Go to Sign In</a></p></div>';
    }

    function tabsBar(counts) {
      return '<div class="tabs">' +
        tabBtn("requests", "Access Requests", counts.requests) +
        tabBtn("tree", "Tree Review", counts.tree) +
        tabBtn("members", "Members", counts.members) +
        tabBtn("reconcile", "Tree Check", counts.reconcile) +
        tabBtn("invites", "Invites", counts.invites) +
        tabBtn("guest", "Guest Passes", counts.guest) +
        (ME && ME.role === "admin" ? tabBtn("logins", "Login Log", 0) : "") +
        (ME && ME.role === "admin" ? tabBtn("settings", "Settings", 0) : "") +
        '<a class="tab" href="tree.html" style="margin-left:auto;">View Tree</a>' +
        '<a class="tab" href="login.html">My Account</a>' +
        "</div>";
    }
    function tabBtn(id, label, n) {
      return '<button class="tab ' + (TAB === id ? "active" : "") + '" data-tab="' + id + '">' +
        label + (n ? '<span class="count">' + n + "</span>" : "") + "</button>";
    }

    async function load() {
      const { data: reqs } = await MillerDB.listAccessRequests();
      const { data: members } = await MillerDB.listProfiles();
      const { data: invites } = await MillerDB.client.from("invites").select("*").order("created_at", { ascending: false });
      const { data: subs } = await MillerDB.listSubmissions();
      const { data: persons } = await MillerDB.listPersons();
      const { data: passes } = await MillerDB.listGuestPasses();
      const { data: redemptions } = await MillerDB.listGuestRedemptions();
      const settings = (ME.role === "admin") ? await MillerDB.getSettings() : {};
      PERSON_BYID = {}; (persons || []).forEach(p => PERSON_BYID[p.id] = p);
      PROFILE_BYID = {}; (members || []).forEach(m => PROFILE_BYID[m.id] = m);

      const pendingReqs = (reqs || []).filter((r) => r.status === "pending").length;
      const pendingSubs = (subs || []).filter((s) => s.status === "pending").length;
      const activePasses = (passes || []).filter((p) => !p.revoked && new Date(p.expires_at) > new Date());
      const unlinkedMembers = (members || []).filter((m) => !m.person_id || !PERSON_BYID[m.person_id]);
      const counts = { requests: pendingReqs, tree: pendingSubs, members: (members || []).length, reconcile: unlinkedMembers.length, invites: (invites || []).filter(i=>!i.used).length, guest: activePasses.length };

      let logins = [];
      if (TAB === "logins" && ME.role === "admin") {
        const r = await MillerDB.recentLoginEvents(150);
        logins = (r && r.data) || [];
      }

      let body = tabsBar(counts);
      if (TAB === "requests") body += renderRequests(reqs || []);
      if (TAB === "tree") body += renderSubmissions(subs || []);
      if (TAB === "members") body += renderMembers(members || []);
      if (TAB === "reconcile") body += renderReconcile(members || [], persons || []);
      if (TAB === "invites") body += renderInvites(invites || []);
      if (TAB === "guest") body += renderGuestPasses(passes || [], redemptions || []);
      if (TAB === "logins") body += renderLogins(logins);
      if (TAB === "settings") body += renderSettings(settings);
      wrap.innerHTML = body;
      bind();
    }

    function pname(id) { return id && PERSON_BYID[id] ? PERSON_BYID[id].full_name : "(unknown)"; }
    function submitterName(id) {
      const p = PROFILE_BYID[id];
      return p ? (p.full_name || p.email) : "a member";
    }
    function summarize(s) {
      const d = s.data || {};
      const bits = [];
      if (d.full_name) bits.push("<b>" + esc(d.full_name) + "</b>");
      const bd = MillerDB.fmtDate(d.birth_year, d.birth_month, d.birth_day);
      const dd = MillerDB.fmtDate(d.death_year, d.death_month, d.death_day);
      const yrs = [bd, dd].filter(Boolean).join(" – ");
      if (yrs) bits.push(esc(yrs));
      if (d.gender) bits.push(esc(d.gender));
      if (d.maiden_name) bits.push("née " + esc(d.maiden_name));
      if (d.is_living === false) bits.push("in memoriam");
      let rel = [];
      if (d.father_id) rel.push("father: " + esc(pname(d.father_id)));
      if (d.mother_id) rel.push("mother: " + esc(pname(d.mother_id)));
      if (d.partner_id) rel.push("spouse of: " + esc(pname(d.partner_id)));
      if (d.child_id) rel.push("to be the " + (d.child_role === "mother" ? "mother" : "father") + " of: " + esc(pname(d.child_id)));
      if (d.notes) rel.push("notes: " + esc(d.notes));
      return bits.join(" · ") + (rel.length ? "<br><span class='meta'>" + rel.join(" · ") + "</span>" : "");
    }
    function renderSubmissions(subs) {
      const pending = subs.filter(s => s.status === "pending");
      const done = subs.filter(s => s.status !== "pending").slice(0, 15);
      if (!subs.length) return '<p class="empty">No tree submissions yet. Members can propose additions from the tree.</p>';
      const card = (s, actions) =>
        '<div class="row">' +
          "<h3>" + (s.kind === "add" ? "Add person" : "Edit " + esc(pname(s.target_id))) +
            ' <span class="pill ' + s.status + '">' + s.status + "</span></h3>" +
          '<div class="meta">Proposed by ' + esc(submitterName(s.submitted_by)) + " · " + fmt(s.created_at) + "</div>" +
          '<div style="margin:.5rem 0">' + summarize(s) + "</div>" +
          (actions
            ? '<div class="actions"><button class="btn btn--gold btn--sm" data-approve-sub="' + s.id + '">Approve &amp; add to tree</button>' +
              '<button class="btn btn--outline btn--sm" data-reject-sub="' + s.id + '">Reject</button></div>'
            : (s.review_note ? '<div class="meta">Note: ' + esc(s.review_note) + "</div>" : "")) +
        "</div>";
      let html = "";
      if (pending.length) html += '<div class="list">' + pending.map(s => card(s, true)).join("") + "</div>";
      else html += '<p class="empty">No pending submissions — the tree is all caught up. ✨</p>';
      if (done.length) html += '<h3 style="font-family:Cinzel,serif;color:var(--purple-800);margin:1.4rem 0 .6rem">Recently reviewed</h3><div class="list">' + done.map(s => card(s, false)).join("") + "</div>";
      return html;
    }

    function renderRequests(reqs) {
      if (!reqs.length) return '<p class="empty">No access requests yet.</p>';
      return '<div class="list">' + reqs.map((r) =>
        '<div class="row" data-req="' + r.id + '">' +
          "<h3>" + esc(r.full_name) + ' <span class="pill ' + r.status + '">' + r.status + "</span></h3>" +
          '<div class="meta">' + esc(r.email) + (r.phone ? " · " + esc(r.phone) : "") + "<br>" +
            (r.relationship ? "Relationship: " + esc(r.relationship) + "<br>" : "") +
            (r.note ? "Note: " + esc(r.note) + "<br>" : "") +
            "Requested: " + fmt(r.created_at) + "</div>" +
          (r.status !== "denied"
            ? '<div class="actions"><button class="btn btn--gold btn--sm" data-approve="' + r.id + '" data-email="' + esc(r.email) + '" data-name="' + esc(r.full_name || "") + '">' +
              (r.status === "pending" ? "Approve &amp; create login" : "Create / resend login") + "</button>" +
              (r.status === "pending" ? '<button class="btn btn--outline btn--sm" data-deny="' + r.id + '">Deny</button>' : "") + "</div>"
            : "") +
          '<div class="invite-out"></div>' +
        "</div>"
      ).join("") + "</div>";
    }

    function renderMembers(members) {
      if (!members.length) return '<p class="empty">No members yet.</p>';
      const canRole = ME.role === "admin";
      const treePersons = Object.values(PERSON_BYID).sort((a, b) => (a.full_name || "").localeCompare(b.full_name || ""));
      return '<div class="list">' + members.map((m) =>
        '<div class="row">' +
          "<h3>" + esc(m.full_name || m.email) +
            ' <span class="pill ' + m.role + '">' + m.role + '</span> <span class="pill ' + m.status + '">' + m.status + "</span></h3>" +
          '<div class="meta">' + esc(m.email) + (m.phone ? " · " + esc(m.phone) : "") + "</div>" +
          '<div class="actions">' +
            (canRole
              ? 'Role: <select data-role="' + m.id + '">' +
                ["member","elder","admin"].map((r)=>'<option value="'+r+'"'+(m.role===r?" selected":"")+">"+r+"</option>").join("") +
                "</select>"
              : "") +
            'Status: <select data-status="' + m.id + '">' +
              ["pending","active","suspended"].map((s)=>'<option value="'+s+'"'+(m.status===s?" selected":"")+">"+s+"</option>").join("") +
              "</select>" +
            (canRole ? ' <button class="btn btn--sm btn--outline" data-setpw="' + m.id + '" data-email="' + esc(m.email) + '" data-name="' + esc(m.full_name || "") + '">Reset password</button>' : "") +
          "</div>" +
          (canRole ? (function () {
            var linkOpts = treePersons.map((p) => '<option value="' + p.id + '"' + (m.person_id === p.id ? " selected" : "") + ">" + esc(p.full_name) + (p.birth_year ? " (b. " + p.birth_year + ")" : "") + "</option>").join("");
            var parentOpts = treePersons.map((p) => '<option value="' + p.id + '">' + esc(p.full_name) + (p.birth_year ? " (b. " + p.birth_year + ")" : "") + "</option>").join("");
            var linkedName = (m.person_id && PERSON_BYID[m.person_id]) ? esc(PERSON_BYID[m.person_id].full_name) : "";
            return '<div class="actions" style="margin-top:.4rem">Link to <b>existing</b> tree person: <select data-person="' + m.id + '">' +
                '<option value="">— not on tree (can\'t post) —</option>' + linkOpts +
              '</select> <span class="linkmsg" data-linkmsg="' + m.id + '">' + (linkedName ? "✓ Linked to " + linkedName : "") + "</span></div>" +
              '<div class="actions" style="margin-top:.3rem;font-size:.9rem;color:#555">…or make a <b>new</b> tree person for them as a child of: ' +
                '<select data-childparent="' + m.id + '"><option value="">— choose parent —</option>' + parentOpts + "</select> " +
                '<button class="btn btn--sm btn--outline" data-addchild="' + m.id + '" data-name="' + esc(m.full_name || "") + '">＋ Create as child &amp; link</button></div>';
          })() : "") +
          '<div class="pw-out"></div>' +
        "</div>"
      ).join("") + "</div>";
    }

    function renderReconcile(members, persons) {
      const treePersons = Object.values(PERSON_BYID).sort((a, b) => (a.full_name || "").localeCompare(b.full_name || ""));
      const linkedBy = {};                     // person_id -> member
      members.forEach((m) => { if (m.person_id) linkedBy[m.person_id] = m; });
      const unlinked = members.filter((m) => !m.person_id || !PERSON_BYID[m.person_id]);
      const linked = members.filter((m) => m.person_id && PERSON_BYID[m.person_id]);
      const orphans = (persons || []).filter((p) => !linkedBy[p.id]).sort((a, b) => (a.full_name || "").localeCompare(b.full_name || ""));
      const chip = (txt, bg, col) => '<span style="display:inline-block;background:' + bg + ';color:' + col + ';border-radius:999px;padding:.15rem .6rem;font-size:.78rem;margin:.15rem;font-family:\'Cinzel\',serif;">' + esc(txt) + "</span>";

      const linkSelect = (m) =>
        'Link to tree person: <select data-person="' + m.id + '"><option value="">— not on tree —</option>' +
        treePersons.map((p) => '<option value="' + p.id + '"' + (m.person_id === p.id ? " selected" : "") + ">" + esc(p.full_name) + (p.birth_year ? " (b. " + p.birth_year + ")" : "") + "</option>").join("") +
        '</select> <span class="linkmsg" data-linkmsg="' + m.id + '"></span>';
      const suggest = (m) => {
        const nm = String(m.full_name || "").trim().toLowerCase();
        if (!nm) return "";
        const hit = treePersons.find((p) => String(p.full_name || "").trim().toLowerCase() === nm && !linkedBy[p.id]);
        return hit
          ? '<div class="meta" style="color:#1b6b1b">✓ exact name match on the tree: <b>' + esc(hit.full_name) + "</b> — select it below to link</div>"
          : '<div class="meta" style="color:#b07400">No exact tree match — add them to the tree first, or pick the right person below.</div>';
      };

      let h = '<div class="row"><h3 style="margin:.2rem 0">Member ↔ Tree reconciliation</h3>' +
        '<div class="meta">' + members.length + " members · " + linked.length + " linked · " +
        '<b style="color:' + (unlinked.length ? "#b11" : "#1b6b1b") + '">' + unlinked.length + " not linked</b> · " +
        orphans.length + " tree people with no account</div></div>";

      h += '<h3 style="margin-top:1rem">⚠ Members not on the tree (' + unlinked.length + ")</h3>";
      h += unlinked.length
        ? '<div class="list">' + unlinked.map((m) => {
            const nm = String(m.full_name || "").trim().toLowerCase();
            const hit = nm ? treePersons.find((p) => String(p.full_name || "").trim().toLowerCase() === nm && !linkedBy[p.id]) : null;
            const addBtn = (!hit && m.full_name)
              ? '<button class="btn btn--sm btn--gold" data-addtree="' + m.id + '" data-name="' + esc(m.full_name) + '">＋ Add to tree &amp; link</button> '
              : "";
            return '<div class="row"><h3>' + esc(m.full_name || m.email) + " " + chip(m.status, m.status === "active" ? "#d6f2d6" : "#eee", "#333") +
              (m.person_id && !PERSON_BYID[m.person_id] ? " " + chip("broken link", "#f7d6d6", "#b11") : "") + "</h3>" +
              '<div class="meta">' + esc(m.email) + "</div>" + suggest(m) +
              '<div class="actions" style="margin-top:.4rem">' + addBtn + linkSelect(m) + "</div></div>";
          }).join("") + "</div>"
        : '<p class="empty">Everyone is linked to the tree. 🎉</p>';

      h += '<h3 style="margin-top:1.2rem">✓ Linked members (' + linked.length + ")</h3>";
      h += linked.length
        ? '<div class="list">' + linked.map((m) => { const p = PERSON_BYID[m.person_id];
            return '<div class="row"><h3>' + esc(m.full_name || m.email) + " " + chip(m.status, m.status === "active" ? "#d6f2d6" : "#eee", "#333") + "</h3>" +
              '<div class="meta">→ tree: <b>' + esc(p.full_name) + "</b>" + (p.is_living === false ? " (in memoriam)" : "") + "</div></div>"; }).join("") + "</div>"
        : '<p class="empty">No members are linked yet.</p>';

      h += '<h3 style="margin-top:1.2rem">Tree people with no account (' + orphans.length + ")</h3>";
      h += orphans.length
        ? '<div class="meta">On the tree but no app account yet (invite them, or they may be children/passed):</div><div style="margin-top:.4rem">' +
            orphans.map((p) => chip(p.full_name + (p.is_living === false ? " ✝" : ""), "#efe6f7", "#5a1e8c")).join("") + "</div>"
        : '<p class="empty">None — every tree person has an account.</p>';

      return h;
    }

    // Build a ready-to-send message with the member's login, + a copy button
    function credBlurb(name, email, password) {
      const site = (window.MILLER_CONFIG && window.MILLER_CONFIG.siteUrl) || location.origin;
      const first = name ? String(name).split(" ")[0] : "there";
      const msg = "Hi " + first + "! You've been added to the Miller Family app.\n\n" +
        "Open: " + site + "\nTap \"Sign In\" and use:\n" +
        "Email: " + email + "\nPassword: " + password + "\n\n" +
        "You can change your password after you sign in.";
      return '<div class="notice"><div style="font-weight:700;margin-bottom:.35rem">✅ New password set for <span style="color:#6b21a8">' + esc(email) + "</span></div>" +
        "This password works only for that email. Send it to them by text or email:" +
        '<textarea class="credmsg" readonly rows="8" style="width:100%;margin-top:.5rem;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;border-radius:8px;padding:.6rem;border:1px solid #d9c6ec;">' + esc(msg) + "</textarea>" +
        '<button class="btn btn--gold btn--sm" data-copy>Copy message</button></div>';
    }
    function wireCopy(container) {
      const btn = container.querySelector("[data-copy]");
      const ta = container.querySelector(".credmsg");
      if (btn && ta) btn.addEventListener("click", () => {
        navigator.clipboard.writeText(ta.value).then(() => { btn.textContent = "Copied ✓"; }, () => { ta.select(); });
      });
    }

    function renderLogins(events) {
      if (!events.length) return '<p class="empty">No sign-in attempts recorded yet. New sign-ins (successful and failed) will appear here.</p>';
      const td = 'padding:.45rem .5rem;border-bottom:1px solid #e7e0f0;';
      const th = 'text-align:left;' + td + 'font-weight:600;';
      const rows = events.map((e) => {
        const when = e.created_at ? new Date(e.created_at).toLocaleString() : "—";
        const ok = !!e.success;
        return '<tr>' +
          '<td style="' + td + '">' + esc(when) + "</td>" +
          '<td style="' + td + '">' + esc(e.email || "—") + "</td>" +
          '<td style="' + td + '"><span class="pill ' + (ok ? "active" : "suspended") + '">' + (ok ? "✓ success" : "✗ failed") + "</span></td>" +
          "</tr>";
      }).join("");
      const fails = events.filter((e) => !e.success).length;
      return '<div class="meta" style="margin:.4rem 0 .8rem">Showing the ' + events.length + " most recent sign-in attempts · " +
          fails + " failed. Failed attempts show the email that was typed.</div>" +
        '<table style="width:100%;border-collapse:collapse;font-size:.9rem">' +
          '<thead><tr><th style="' + th + '">When</th><th style="' + th + '">Email entered</th><th style="' + th + '">Result</th></tr></thead>' +
          "<tbody>" + rows + "</tbody></table>";
    }

    function renderSettings(s) {
      const limit = s.photo_limit || "3";
      const vids = s.videos_enabled === "true";
      return '<div class="row"><h3>App Settings</h3>' +
        '<div class="meta">These control limits across the whole app. Only admins can change them.</div>' +
        '<div class="actions" style="margin-top:1rem;align-items:center;">Free photos per member: ' +
          '<input id="set-photo" type="number" min="0" value="' + esc(limit) + '" style="width:76px;padding:.45rem;border-radius:8px;border:1px solid rgba(109,40,168,.3);" /></div>' +
        '<div class="actions" style="margin-top:.8rem;align-items:center;">Video uploads (premium): ' +
          '<select id="set-vids"><option value="false"' + (!vids ? " selected" : "") + ">Off</option>" +
          '<option value="true"' + (vids ? " selected" : "") + ">On</option></select></div>" +
        '<div class="actions" style="margin-top:1rem;align-items:center;"><button class="btn btn--gold btn--sm" id="save-settings">Save settings</button>' +
          '<span id="set-msg" class="meta"></span></div>' +
        '<div class="meta" style="margin-top:.9rem;">Turning video uploads <b>On</b> lets members upload videos. Collect any fee separately — the app does not process payments.</div>' +
      "</div>";
    }

    function renderInvites(invites) {
      const form = '<div class="row"><h3>Create an invite code</h3>' +
        '<div class="actions">' +
          '<input id="inv-email" placeholder="(optional) lock to email" style="padding:.5rem;border-radius:10px;border:1px solid #ccc;" />' +
          '<select id="inv-role">' + ["member","elder","admin"].map((r)=>'<option value="'+r+'">'+r+"</option>").join("") + "</select>" +
          '<button class="btn btn--gold btn--sm" id="inv-create">Create</button>' +
        '</div><div id="inv-out"></div></div>';
      const list = !invites.length ? '<p class="empty">No invites yet.</p>' :
        '<div class="list">' + invites.map((i) =>
          '<div class="row"><h3><span class="code">' + esc(i.code) + "</span> " +
          '<span class="pill ' + i.role + '">' + i.role + '</span> ' +
          '<span class="pill ' + (i.used ? "denied" : "active") + '">' + (i.used ? "used" : "open") + "</span></h3>" +
          '<div class="meta">' + (i.email ? "For: " + esc(i.email) + " · " : "") + "Created: " + fmt(i.created_at) +
          (i.expires_at ? " · Expires: " + fmt(i.expires_at) : "") + "</div></div>"
        ).join("") + "</div>";
      return form + "<div style='height:1rem'></div>" + list;
    }

    /* ---- Guest passes ---- */
    function guestJoinLink(code) {
      const site = (window.MILLER_CONFIG && window.MILLER_CONFIG.siteUrl) || location.origin;
      return site.replace(/\/+$/, "") + "/join.html?code=" + encodeURIComponent(code);
    }
    function daysLeft(iso) { return Math.ceil((new Date(iso).getTime() - Date.now()) / 86400000); }
    function passStatus(p) {
      if (p.revoked) return "revoked";
      if (new Date(p.expires_at) <= new Date()) return "expired";
      return "active";
    }
    function guestBlurb(code, expires_at) {
      const link = guestJoinLink(code);
      const msg = "You're invited to the Miller Family app! 💜\n\n" +
        "1) Open this link: " + link + "\n" +
        "2) Create your account using invite code: " + code + "\n" +
        "3) The page shows you how to install the app and add yourself to the family tree.\n\n" +
        "Your invite code is good through " + fmt(expires_at) + ".";
      return '<div class="notice">Guest pass ready — send this by text or email:' +
        '<textarea class="credmsg" readonly rows="8" style="width:100%;margin-top:.5rem;font-family:ui-monospace,Consolas,monospace;font-size:.82rem;border-radius:8px;padding:.6rem;border:1px solid #d9c6ec;">' + esc(msg) + "</textarea>" +
        '<button class="btn btn--gold btn--sm" data-copy>Copy message</button></div>';
    }
    function renderGuestPasses(passes, redemptions) {
      const soon = passes.filter((p) => passStatus(p) === "active" && daysLeft(p.expires_at) <= 3);
      const banner = soon.length
        ? '<div class="notice" style="border:1px solid #caa24a;background:#fff7e6;color:#5a4a14;border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem">⚠ ' +
          soon.length + " guest pass" + (soon.length > 1 ? "es" : "") + " expiring within 3 days: " +
          soon.map((p) => esc(p.code) + " (in " + Math.max(0, daysLeft(p.expires_at)) + "d)").join(", ") +
          ". Admins are emailed automatically; create a new pass if one is still needed.</div>"
        : "";
      const form = '<div class="row"><h3>Create a guest pass</h3>' +
        '<div class="meta">Generates an invite code valid for <b>7 days</b>. Text the message to anyone you want to let in — each person creates their own <b>permanent</b> account, and admins are emailed to verify every new signup.</div>' +
        '<div class="actions" style="margin-top:.8rem">' +
          '<input id="gp-label" placeholder="(optional) note, e.g. “Betty’s side”" style="padding:.5rem;border-radius:10px;border:1px solid #ccc;flex:1;min-width:160px;" />' +
          '<button class="btn btn--gold btn--sm" id="gp-create">Create guest pass</button>' +
        '</div><div id="gp-out" style="margin-top:.8rem"></div></div>';
      const redByPass = {};
      redemptions.forEach((r) => (redByPass[r.pass_id] = redByPass[r.pass_id] || []).push(r));
      const list = !passes.length ? '<p class="empty">No guest passes yet.</p>' :
        '<div class="list">' + passes.map((p) => {
          const st = passStatus(p), reds = redByPass[p.id] || [];
          return '<div class="row"><h3><span class="code">' + esc(p.code) + "</span> " +
            '<span class="pill ' + (st === "active" ? "active" : "denied") + '">' + st + "</span></h3>" +
            '<div class="meta">' + (p.label ? esc(p.label) + " · " : "") + "Created " + fmt(p.created_at) + " · " +
              (st === "active" ? "Expires " + fmt(p.expires_at) + " (in " + Math.max(0, daysLeft(p.expires_at)) + " days)" : "Expired " + fmt(p.expires_at)) +
              " · " + (p.uses || 0) + " account" + (p.uses === 1 ? "" : "s") + " created</div>" +
            (reds.length ? '<div class="meta">Joined: ' + reds.map((r) => esc(r.full_name || r.email)).join(", ") + "</div>" : "") +
            '<div class="actions">' +
              (st === "active"
                ? '<button class="btn btn--outline btn--sm" data-gpcopy="' + esc(p.code) + '" data-gpexp="' + esc(p.expires_at) + '">Copy invite message</button>' +
                  '<button class="btn btn--outline btn--sm" data-gprevoke="' + p.id + '">Revoke</button>'
                : "") +
            '</div><div class="gp-copyout"></div></div>';
        }).join("") + "</div>";
      return banner + form + "<div style='height:1rem'></div>" + list;
    }

    // Lightweight per-list filter box (added above every list with 2+ rows).
    function attachFilters() {
      wrap.querySelectorAll(".list").forEach((list) => {
        const prev = list.previousElementSibling;
        if (prev && prev.classList && prev.classList.contains("filterbar")) return;
        if (list.querySelectorAll(":scope > .row").length < 2) return;
        const bar = document.createElement("div");
        bar.className = "filterbar";
        bar.innerHTML = '<input type="text" placeholder="Filter this list… (name, email, status, role)" aria-label="Filter list" /><span class="filtercount"></span>';
        const inp = bar.querySelector("input"), cnt = bar.querySelector(".filtercount");
        const run = () => {
          const q = inp.value.trim().toLowerCase();
          let shown = 0;
          list.querySelectorAll(":scope > .row").forEach((r) => {
            const hit = !q || r.textContent.toLowerCase().indexOf(q) !== -1;
            r.style.display = hit ? "" : "none";
            if (hit) shown++;
          });
          cnt.textContent = q ? shown + " match" + (shown === 1 ? "" : "es") : "";
        };
        inp.addEventListener("input", run);
        list.parentNode.insertBefore(bar, list);
      });
    }

    function bind() {
      wrap.querySelectorAll("[data-tab]").forEach((b) =>
        b.addEventListener("click", () => { TAB = b.dataset.tab; load(); }));

      wrap.querySelectorAll("[data-approve]").forEach((b) =>
        b.addEventListener("click", async () => {
          const origLabel = b.innerHTML;
          b.disabled = true; b.textContent = "Creating login…";
          const id = b.dataset.approve, email = b.dataset.email, name = b.dataset.name || "";
          const { data, error } = await MillerDB.adminCreateMember({ email, full_name: name });
          if (error || !data || data.error || !data.password) {
            b.disabled = false; b.innerHTML = origLabel;
            if (error && error.code === "session_expired") { alert(error.message); return; }
            alert("Could not create login: " + (error ? error.message : (data && data.error) || "unknown error"));
            return;
          }
          await MillerDB.setAccessRequestStatus(id, "approved");
          const out = b.closest(".row").querySelector(".invite-out");
          out.innerHTML = credBlurb(name, email, data.password);
          wireCopy(out);
          b.closest(".actions").remove();
        }));

      wrap.querySelectorAll("[data-setpw]").forEach((b) =>
        b.addEventListener("click", async () => {
          b.disabled = true; const label = b.textContent; b.textContent = "Working…";
          const { data, error } = await MillerDB.adminCreateMember({ email: b.dataset.email, full_name: b.dataset.name || "" });
          b.disabled = false; b.textContent = label;
          if (error || !data || data.error || !data.password) {
            if (error && error.code === "session_expired") { alert(error.message); return; }
            alert("Could not set password: " + (error ? error.message : (data && data.error) || "unknown error"));
            return;
          }
          const out = b.closest(".row").querySelector(".pw-out");
          out.innerHTML = credBlurb(b.dataset.name || "", b.dataset.email, data.password);
          wireCopy(out);
        }));

      wrap.querySelectorAll("[data-deny]").forEach((b) =>
        b.addEventListener("click", async () => {
          await MillerDB.setAccessRequestStatus(b.dataset.deny, "denied"); load();
        }));

      wrap.querySelectorAll("[data-approve-sub]").forEach((b) =>
        b.addEventListener("click", async () => {
          b.disabled = true; b.textContent = "Approving…";
          const { data, error } = await MillerDB.approveSubmission(b.dataset.approveSub);
          if (error || data !== "ok") { b.disabled = false; b.textContent = "Approve & add to tree"; alert("Could not approve: " + (error ? error.message : data)); return; }
          load();
        }));
      wrap.querySelectorAll("[data-reject-sub]").forEach((b) =>
        b.addEventListener("click", async () => {
          const { error } = await MillerDB.rejectSubmission(b.dataset.rejectSub);
          if (error) { alert("Could not reject: " + error.message); return; }
          load();
        }));

      wrap.querySelectorAll("[data-role]").forEach((sel) =>
        sel.addEventListener("change", async () => {
          const { error } = await MillerDB.setRole(sel.dataset.role, sel.value);
          if (error) alert("Could not change role (admins only).");
        }));
      wrap.querySelectorAll("[data-status]").forEach((sel) =>
        sel.addEventListener("change", async () => {
          const { error } = await MillerDB.setStatus(sel.dataset.status, sel.value);
          if (error) alert("Could not change status.");
        }));
      wrap.querySelectorAll("[data-person]").forEach((sel) =>
        sel.addEventListener("change", async () => {
          const note = wrap.querySelector('[data-linkmsg="' + sel.dataset.person + '"]');
          if (note) { note.textContent = "saving…"; note.style.color = "#6b5b7a"; }
          const { error } = await MillerDB.setMemberPerson(sel.dataset.person, sel.value || null);
          if (error) {
            const msg = /unique|duplicate/i.test(error.message)
              ? "that tree person is already linked to another member."
              : "could not save: " + error.message;
            if (note) { note.textContent = "⚠ " + msg; note.style.color = "#b11"; } else alert(msg);
            return;
          }
          if (note) {
            if (sel.value) {
              const opt = sel.options[sel.selectedIndex];
              note.textContent = "✓ Linked to " + (opt ? opt.text.replace(/\s*\(b\.[^)]*\)\s*$/, "") : "person");
            } else { note.textContent = "✓ unlinked"; }
            note.style.color = "#1b6b1b";
          }
        }));
      wrap.querySelectorAll("[data-addchild]").forEach((b) =>
        b.addEventListener("click", async () => {
          const mid = b.dataset.addchild, name = b.dataset.name || "";
          const psel = wrap.querySelector('[data-childparent="' + mid + '"]');
          const parentId = psel && psel.value;
          if (!parentId) { alert("Choose the parent first, then click “Create as child & link”."); return; }
          const parent = PERSON_BYID[parentId];
          const parentName = parent ? parent.full_name : "the selected parent";
          if (!confirm('Create a NEW tree person "' + name + '" as a child of ' + parentName + ', and link this account to it?')) return;
          b.disabled = true; b.textContent = "Creating…";
          const fields = { full_name: name };
          if (parent && parent.gender === "female") fields.mother_id = parentId; else fields.father_id = parentId;
          const { data, error } = await MillerDB.createPersonDirect(fields);
          if (error || !data) { b.disabled = false; b.textContent = "＋ Create as child & link"; alert("Could not create: " + ((error && error.message) || "unknown error")); return; }
          const r = await MillerDB.setMemberPerson(mid, data.id);
          if (r && r.error) alert("Created the child node, but linking failed: " + r.error.message);
          load();
        }));
      wrap.querySelectorAll("[data-addtree]").forEach((b) =>
        b.addEventListener("click", async () => {
          const name = b.dataset.name;
          if (!confirm('Add "' + name + '" to the family tree and link this account?\n\n(Creates a bare tree entry — you can set their parents/relations later from the tree.)')) return;
          b.disabled = true; b.textContent = "Adding…";
          const { data, error } = await MillerDB.createPersonDirect({ full_name: name });
          if (error || !data) { b.disabled = false; b.textContent = "＋ Add to tree & link"; alert("Could not add: " + ((error && error.message) || "unknown error")); return; }
          const r = await MillerDB.setMemberPerson(b.dataset.addtree, data.id);
          if (r && r.error) alert("Added to the tree, but linking failed: " + r.error.message);
          load();
        }));

      attachFilters();

      const gpCreate = document.getElementById("gp-create");
      if (gpCreate) gpCreate.addEventListener("click", async () => {
        gpCreate.disabled = true; gpCreate.textContent = "Creating…";
        const label = (document.getElementById("gp-label").value || "").trim();
        const { error, code, expires_at } = await MillerDB.createGuestPass({ days: 7, label });
        gpCreate.disabled = false; gpCreate.textContent = "Create guest pass";
        if (error) { alert("Could not create pass: " + error.message); return; }
        const out = document.getElementById("gp-out");
        out.innerHTML = guestBlurb(code, expires_at);
        wireCopy(out);
      });
      wrap.querySelectorAll("[data-gpcopy]").forEach((b) =>
        b.addEventListener("click", () => {
          const out = b.closest(".row").querySelector(".gp-copyout");
          out.innerHTML = guestBlurb(b.dataset.gpcopy, b.dataset.gpexp);
          wireCopy(out);
        }));
      wrap.querySelectorAll("[data-gprevoke]").forEach((b) =>
        b.addEventListener("click", async () => {
          if (!confirm("Revoke this guest pass? The code will stop working immediately.")) return;
          const { error } = await MillerDB.revokeGuestPass(b.dataset.gprevoke);
          if (error) { alert("Could not revoke: " + error.message); return; }
          load();
        }));

      const saveS = document.getElementById("save-settings");
      if (saveS) saveS.addEventListener("click", async () => {
        const m = document.getElementById("set-msg");
        m.textContent = " saving…";
        const pl = String(parseInt(document.getElementById("set-photo").value, 10) || 3);
        const vids = document.getElementById("set-vids").value;
        const r1 = await MillerDB.saveSetting("photo_limit", pl);
        const r2 = await MillerDB.saveSetting("videos_enabled", vids);
        m.textContent = (r1.error || r2.error) ? " could not save" : " saved ✓";
      });

      const invCreate = document.getElementById("inv-create");
      if (invCreate) invCreate.addEventListener("click", async () => {
        const email = document.getElementById("inv-email").value.trim();
        const role = document.getElementById("inv-role").value;
        const { code, error } = await MillerDB.createInvite({ email: email || null, role, expiresDays: 60 });
        const out = document.getElementById("inv-out");
        out.innerHTML = error ? '<div class="notice">Could not create invite.</div>'
          : '<div class="notice">New code: <span class="code">' + esc(code) + "</span></div>";
      });
    }

    (async function init() {
      if (!MillerDB.configured) return gate("Backend isn't connected yet.");
      await new Promise((r) => setTimeout(r, 300));
      const session = await MillerDB.getSession();
      if (!session) return gate("Please sign in first.");
      ME = await MillerDB.getProfile();
      if (!ME) return gate("Finishing sign-in… please refresh.");
      if (!(ME.role === "admin" || ME.role === "elder") || ME.status !== "active")
        return gate("You don't have reviewer access.");
      who.textContent = (ME.full_name || ME.email) + " · " + ME.role;
      if (location.hash === "#tree") TAB = "tree";
      load();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Events · Miller Family</title>
  <meta name="theme-color" content="#3B0A58" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body { background: linear-gradient(180deg, #faf5ef, #f1e8f7); min-height:100vh; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem;
      background: linear-gradient(160deg, var(--purple-900), var(--purple-600)); color:#fff;
      padding: calc(env(safe-area-inset-top,0px) + .9rem) 1rem .9rem; position:sticky; top:env(safe-area-inset-top,0px); z-index:20; }
    .topbar .script { font-family:"Great Vibes",cursive; color:var(--gold); font-size:1.7rem; line-height:1; }
    .topbar .sub { font-family:"Cinzel",serif; font-size:.7rem; letter-spacing:.1em; color:#e9dcff; }
    .topbar a.home { color:var(--gold-soft); text-decoration:none; font-family:"Cinzel",serif; font-size:.85rem; }
    .wrap { max-width:860px; margin:0 auto; padding:1.2rem 1rem calc(3rem + env(safe-area-inset-bottom,0px)); }
    .card { background:#fff; border-radius:16px; box-shadow:var(--shadow); border:1px solid rgba(109,40,168,.12); padding:1.3rem; margin-bottom:1.4rem; }
    .card h2 { font-family:"Cinzel",serif; color:var(--purple-800); margin:0 0 .2rem; font-size:1.2rem; }
    .card .lede { color:#6b5b7a; margin:.1rem 0 1rem; font-size:.92rem; }
    .eventline { font-family:"Cinzel",serif; color:var(--purple-800); }
    .banner { background:linear-gradient(160deg,var(--purple-900),var(--purple-600)); color:#fff; border-radius:16px; padding:1.1rem 1.3rem; margin-bottom:1.4rem; text-align:center; }
    .banner b { color:var(--gold-soft); font-size:1.4rem; font-family:"Cinzel",serif; }
    .field { display:block; margin:.7rem 0; }
    .field span { font-family:"Cinzel",serif; font-size:.8rem; display:block; margin-bottom:.3rem; color:var(--purple-800); }
    .field input, .field select, .field textarea { width:100%; padding:.6rem .8rem; border-radius:10px; border:1px solid rgba(109,40,168,.3); font:inherit; font-family:Georgia,serif; }
    .row { display:flex; gap:.7rem; flex-wrap:wrap; align-items:flex-end; }
    .row .field { flex:1; min-width:120px; margin:0; }
    .checks { display:flex; gap:1.1rem; flex-wrap:wrap; margin:.6rem 0; }
    .checks label { font-family:Georgia,serif; font-size:.9rem; color:#3a2f45; display:inline-flex; gap:.35rem; align-items:center; }
    .checks input { width:auto; }
    .toggle { display:inline-flex; border:1px solid var(--purple-600); border-radius:999px; overflow:hidden; }
    .toggle button { border:0; background:#fff; color:var(--purple-800); font:inherit; padding:.5rem 1.1rem; cursor:pointer; }
    .toggle button.on { background:var(--purple-600); color:#fff; }
    .msg { min-height:1.2em; font-family:"Cinzel",serif; margin-top:.5rem; } .msg.ok{color:#1b6b1b;} .msg.err{color:#b11;}
    .catgroup { margin-top:1rem; } .catgroup h3 { font-family:"Cinzel",serif; color:var(--purple-600); font-size:.95rem; margin:.6rem 0 .3rem; text-transform:capitalize; }
    .item { display:flex; justify-content:space-between; gap:.6rem; padding:.45rem 0; border-bottom:1px dashed rgba(109,40,168,.15); }
    .item .who { color:#7a6a8a; font-size:.82rem; }
    .item .del { background:transparent; border:0; color:#a33; cursor:pointer; font:inherit; font-size:.8rem; }
    .vrole { padding:.8rem 0; border-bottom:1px solid #f0eaf6; }
    .vrole:last-child { border-bottom:0; }
    .vrole .rolehead { display:flex; justify-content:space-between; align-items:baseline; gap:.5rem; }
    .vrole h3 { font-family:"Cinzel",serif; color:var(--purple-800); margin:0; font-size:1rem; }
    .vrole .delrole { background:transparent; border:0; color:#a33; cursor:pointer; font:inherit; font-size:.75rem; }
    .vrole .desc { color:#6b5b7a; font-size:.85rem; margin:.1rem 0 .4rem; }
    .chiplist { display:flex; flex-wrap:wrap; gap:.3rem; margin:.3rem 0; }
    .nchip { background:#efe6f7; color:#5a1e8c; border-radius:999px; padding:.15rem .6rem; font-size:.78rem; }
    .empty { color:#6b5b7a; font-style:italic; font-size:.85rem; }
    .state { max-width:460px; margin:3rem auto; text-align:center; padding:0 1rem; }
    .menu { padding:1rem 1.2rem; }
    .menu .field { margin:0; }
    .menu select { font-family:"Cinzel",serif; }
    .ehead { background:linear-gradient(160deg,var(--purple-900),var(--purple-600)); color:#fff; border-radius:16px; padding:1.1rem 1.3rem; margin-bottom:1rem; position:relative; }
    .ehead h2 { font-family:"Cinzel",serif; color:#fff; margin:0 0 .25rem; font-size:1.3rem; }
    .ehead .meta { color:#e9dcff; font-size:.9rem; margin:.1rem 0; }
    .ehead .del { position:absolute; top:.9rem; right:1rem; background:rgba(255,255,255,.16); border:0; color:#fff; border-radius:999px; padding:.3rem .75rem; cursor:pointer; font:inherit; font-size:.76rem; }
    .tabs { display:flex; gap:.4rem; flex-wrap:wrap; margin-bottom:1rem; }
    .tab { border:1px solid var(--purple-600); background:#fff; color:var(--purple-800); border-radius:999px; padding:.4rem .9rem; font-family:"Cinzel",serif; font-size:.82rem; cursor:pointer; }
    .tab.on { background:var(--purple-600); color:#fff; }
    .ellist { display:flex; flex-direction:column; gap:.5rem; margin-top:.3rem; }
    .elrow { display:flex; align-items:center; gap:.7rem; width:100%; text-align:left; background:#faf7fd; border:1px solid rgba(109,40,168,.15); border-radius:12px; padding:.7rem .9rem; cursor:pointer; font:inherit; }
    .elrow:hover { background:#f3ecfb; }
    .elicon { font-size:1.35rem; line-height:1; }
    .elmain { flex:1; display:flex; flex-direction:column; min-width:0; }
    .eltitle { font-family:"Cinzel",serif; color:var(--purple-800); font-size:1rem; }
    .elsub { color:#6b5b7a; font-size:.82rem; margin-top:.1rem; }
    .elgo { color:var(--purple-600); font-size:1.3rem; }
    .subhead { font-family:"Cinzel",serif; color:var(--purple-600); font-size:.82rem; letter-spacing:.03em; margin:1.1rem 0 .2rem; }
    .nitem { border:1px solid rgba(109,40,168,.18); border-radius:12px; padding:.75rem 1rem; margin-top:.7rem; }
    .nitem h3 { font-family:"Cinzel",serif; color:var(--purple-800); margin:0 0 .15rem; font-size:1rem; }
    .nitem .meta { color:#6b5b7a; font-size:.86rem; margin:.1rem 0; }
    .body { font-size:.92rem; color:#3a2f45; white-space:pre-wrap; }
    .eulogy { white-space:pre-wrap; font-style:italic; color:#473956; border-left:3px solid var(--gold,#caa24a); padding-left:.8rem; }
  </style>
</head>
<body>
  <div class="topbar">
    <div><div class="script">Family Events</div><div class="sub">THE MILLER FAMILY</div></div>
    <div><a class="home" href="tree.html">🌳 Tree</a> &nbsp; <a class="home" href="photos.html">📸 Photos</a> &nbsp; <a class="home" href="reels.html">🎬 Reels <sup style="font-size:.58rem;background:#f3c969;color:#3b0a58;border-radius:5px;padding:.02rem .28rem;font-family:'Cinzel',serif;">soon</sup></a> &nbsp; <a class="home" href="board.html">📝 Posts</a> &nbsp; <a class="home" href="chat.html">💬 Chat</a> &nbsp; <a class="home" href="feedback.html">✍️ Feedback</a> &nbsp; <a class="home" href="login.html">Account</a></div>
  </div>

  <div class="wrap" id="wrap"><div class="state"><p>Loading…</p></div></div>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/notify.js"></script>
  <script>
    const wrap = document.getElementById("wrap");
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));
    let ME = null, EVENTS = [], ATTEND = true;
    const qp = new URLSearchParams(location.search);
    let CUR = qp.get("e") || null;   // event id, or "new-birth" / "new-death"
    let SEC = qp.get("s") || "details";

    function fmtD(v) {
      if (!v) return "";
      const d = new Date(String(v).length <= 10 ? v + "T00:00:00" : v);
      if (isNaN(d)) return esc(v);
      return String(d.getDate()).padStart(2, "0") + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + d.getFullYear();
    }
    function fmtDT(v) {
      if (!v) return "";
      const d = new Date(v);
      if (isNaN(d)) return esc(v);
      return fmtD(v) + " · " + d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    }
    const isAdmin = () => ME && ME.role === "admin";
    const canManageEvent = (ev) => ME && (ev.created_by === ME.id || isAdmin());
    const kindIcon = (k) => ({ birth: "👶 ", death: "🕊️ ", graduation: "🎓 ", wedding: "💍 " }[k] || "🎉 ");
    function linkify(t) {
      return esc(t).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
    }
    function schedRow(label, date, where) {
      if (!date && !where) return "";
      const bits = [];
      if (date) bits.push(fmtD(date));
      if (where) bits.push(esc(where));
      return '<div class="nitem"><h3>' + label + '</h3><div class="meta">' + bits.join(" · ") + "</div></div>";
    }
    function registryBlock(ev) {
      if (!ev.registry_url) return "";
      const links = String(ev.registry_url).split(/\n+/).map((s) => s.trim()).filter(Boolean)
        .map((u) => '<div class="meta">🎁 ' + linkify(u) + "</div>").join("");
      return links ? '<div class="nitem"><h3>Registry / Gift List</h3>' + links + "</div>" : "";
    }
    function syncUrl() { try { history.replaceState(null, "", "event.html?e=" + encodeURIComponent(CUR || "") + "&s=" + SEC); } catch (_) {} }

    /* ---------- top menu: choose an event ---------- */
    function menuCard() {
      const groups = [
        { kind: "reunion",    label: "🎉 Reunion", add: null },
        { kind: "birth",      label: "👶 New Birth Notices",  add: ["new-birth", "➕ Add a birth notice"] },
        { kind: "graduation", label: "🎓 Graduations",        add: ["new-graduation", "➕ Add a graduation"] },
        { kind: "wedding",    label: "💍 Weddings",           add: ["new-wedding", "➕ Add a wedding"] },
        { kind: "death",      label: "🕊️ Death Notices",      add: ["new-death", "➕ Add a death notice"] },
      ];
      const opts = groups.map((g) => {
        const evs = EVENTS.filter((e) => e.kind === g.kind);
        let inner = evs.map((e) => '<option value="' + e.id + '"' + (CUR === e.id ? " selected" : "") + ">" +
          esc(e.title) + (e.event_date ? " — " + esc(fmtD(e.event_date)) : "") + "</option>").join("");
        if (g.add) inner += '<option value="' + g.add[0] + '"' + (CUR === g.add[0] ? " selected" : "") + ">" + esc(g.add[1]) + "</option>";
        if (!inner) return "";
        return '<optgroup label="' + esc(g.label) + '">' + inner + "</optgroup>";
      }).join("");
      const allOpt = '<option value=""' + (!CUR ? " selected" : "") + ">📋 All events</option>";
      return '<div class="card menu"><label class="field"><span>Choose an event</span>' +
        '<select id="nav">' + allOpt + opts + "</select></label></div>";
    }

    function eventRow(ev) {
      const sub = [];
      if (ev.event_date) sub.push(fmtD(ev.event_date) + (ev.start_time ? " · " + esc(ev.start_time) : ""));
      if (ev.kind === "birth" && ev.parents) sub.push("Parents: " + esc(ev.parents));
      if (ev.kind === "graduation" && ev.school) sub.push(esc(ev.school));
      if (ev.kind === "death" && (ev.born_date || ev.death_date)) sub.push((ev.born_date ? fmtD(ev.born_date) : "?") + " – " + (ev.death_date ? fmtD(ev.death_date) : "?"));
      if (ev.location) sub.push("📍 " + esc(ev.location));
      return '<button class="elrow" data-openevent="' + ev.id + '">' +
        '<span class="elicon">' + kindIcon(ev.kind) + "</span>" +
        '<span class="elmain"><span class="eltitle">' + esc(ev.title) + "</span>" +
        (sub.length ? '<span class="elsub">' + sub.join(" · ") + "</span>" : "") + "</span>" +
        '<span class="elgo">›</span></button>';
    }

    function landing() {
      const today = new Date(); today.setHours(0, 0, 0, 0);
      const dated = (e) => (e.event_date ? new Date(e.event_date + "T00:00:00") : null);
      const up = EVENTS.filter((e) => { const d = dated(e); return !d || d >= today; })
        .sort((a, b) => { const da = dated(a), db = dated(b); if (!da && !db) return 0; if (!da) return 1; if (!db) return -1; return da - db; });
      const past = EVENTS.filter((e) => { const d = dated(e); return d && d < today; }).sort((a, b) => dated(b) - dated(a));
      let h = '<div class="card"><h2>Upcoming &amp; future events</h2>';
      h += up.length ? '<div class="ellist">' + up.map(eventRow).join("") + "</div>" : '<p class="empty">No upcoming events yet.</p>';
      h += '<div class="row" style="margin-top:1rem;gap:.5rem">' +
        '<button class="btn btn--outline btn--sm" data-addk="new-birth">👶 Birth</button>' +
        '<button class="btn btn--outline btn--sm" data-addk="new-graduation">🎓 Graduation</button>' +
        '<button class="btn btn--outline btn--sm" data-addk="new-wedding">💍 Wedding</button>' +
        '<button class="btn btn--outline btn--sm" data-addk="new-death">🕊️ Death notice</button></div></div>';
      if (past.length) h += '<div class="card"><h2>Earlier</h2><div class="ellist">' + past.map(eventRow).join("") + "</div></div>";
      return h;
    }

    /* ---------- event header + section tabs ---------- */
    function dateLine(ev) {
      const bits = [];
      if (ev.event_date) bits.push("📅 " + fmtD(ev.event_date) + (ev.start_time ? " · " + esc(ev.start_time) : ""));
      if (ev.location) bits.push("📍 " + esc(ev.location));
      return bits.join("<br>");
    }
    function eventHeader(ev) {
      let extra = "";
      if (ev.kind === "birth") {
        extra += ev.parents ? '<div class="meta">Parents: ' + esc(ev.parents) + "</div>" : "";
        extra += ev.birth_date ? '<div class="meta">Born ' + esc(fmtD(ev.birth_date)) + "</div>" : "";
      } else if (ev.kind === "death") {
        if (ev.born_date || ev.death_date)
          extra += '<div class="meta">' + esc(ev.born_date ? fmtD(ev.born_date) : "?") + " – " + esc(ev.death_date ? fmtD(ev.death_date) : "?") + "</div>";
      } else if (ev.kind === "graduation") {
        extra += ev.school ? '<div class="meta">🎓 ' + esc(ev.school) + "</div>" : "";
        extra += ev.degree ? '<div class="meta">' + esc(ev.degree) + "</div>" : "";
      }
      const canDel = canManageEvent(ev) && ev.kind !== "reunion";
      return '<div class="ehead">' +
        (canDel ? '<button class="del" data-delevent="' + ev.id + '">🗑 delete</button>' : "") +
        "<h2>" + kindIcon(ev.kind) + esc(ev.title) + "</h2>" + extra + "</div>";
    }
    function tabsHTML(ev) {
      const tabs = [["details", "📅 Details"]];
      if (ev.rsvp_enabled) tabs.push(["rsvp", "✅ RSVP"]);
      if (ev.potluck_enabled) tabs.push(["potluck", "🥔 What I'm Bringing"]);
      if (ev.volunteer_enabled) tabs.push(["volunteer", "🙌 Volunteer"]);
      if (!tabs.some((t) => t[0] === SEC)) SEC = "details";
      return '<div class="tabs">' + tabs.map((t) =>
        '<button class="tab ' + (SEC === t[0] ? "on" : "") + '" data-tab="' + t[0] + '">' + t[1] + "</button>").join("") + "</div>";
    }

    /* ---------- sections ---------- */
    function detailsSection(ev) {
      let h = '<div class="card"><h2>Details</h2>';
      const dl = dateLine(ev);
      if (dl) h += '<div class="eventline" style="margin:.3rem 0 .6rem">' + dl + "</div>";
      if (ev.details) h += '<p class="body">' + esc(ev.details) + "</p>";
      if (ev.kind === "death") {
        if (ev.burial_location) h += '<div class="nitem"><h3>🌹 Burial</h3><div class="meta">' + esc(ev.burial_location) + "</div></div>";
        if (ev.eulogy) h += '<div class="subhead">EULOGY</div><div class="eulogy">' + esc(ev.eulogy) + "</div>";
      }
      if (ev.kind === "birth") {
        h += registryBlock(ev);
      }
      if (ev.kind === "wedding") {
        const sched = schedRow("💐 Bridal shower", ev.bridal_shower_date, ev.bridal_shower_where) +
          schedRow("🍺 Bachelor party", ev.bachelor_date, ev.bachelor_where) +
          schedRow("🥂 Bachelorette party", ev.bachelorette_date, ev.bachelorette_where) +
          schedRow("🎼 Rehearsal", ev.rehearsal_date, ev.rehearsal_where) +
          schedRow("👗 Dress fitting", ev.dress_fitting_date, null) +
          schedRow("🤵 Suit fitting", ev.suit_fitting_date, null);
        if (sched) h += '<div class="subhead">WEDDING SCHEDULE</div>' + sched;
        if (ev.wedding_party) h += '<div class="subhead">WEDDING PARTY</div><p class="body">' + esc(ev.wedding_party) + "</p>";
        h += registryBlock(ev);
      }
      const hasExtra = (ev.kind === "death" && (ev.burial_location || ev.eulogy)) ||
        (ev.kind === "birth" && ev.registry_url) ||
        (ev.kind === "wedding" && (ev.registry_url || ev.wedding_party || ev.bridal_shower_date || ev.bachelor_date || ev.bachelorette_date || ev.rehearsal_date || ev.dress_fitting_date || ev.suit_fitting_date));
      if (!dl && !ev.details && !hasExtra) h += '<p class="empty">No details added yet.</p>';
      return h + "</div>";
    }

    function headcount(list) {
      const c = list.filter((r) => r.attending);
      return { households: c.length, people: c.reduce((n, r) => n + (r.guest_count || 0), 0) };
    }
    function rsvpSection(ev, mine, list) {
      const hc = headcount(list);
      const a = mine ? mine.attending : true; ATTEND = a;
      const gc = mine ? mine.guest_count : 1;
      const note = mine ? (mine.note || "") : "";
      return '<div class="banner"><b>' + hc.people + "</b> coming so far" +
          (hc.households ? " · <b>" + hc.households + "</b> RSVPs" : "") + "</div>" +
        '<div class="card"><h2>Will you be there?</h2>' +
        '<div class="toggle" id="att"><button data-a="1" class="' + (a ? "on" : "") + '">Yes, I\'m coming</button>' +
          '<button data-a="0" class="' + (!a ? "on" : "") + '">Can\'t make it</button></div>' +
        '<div class="row" style="margin-top:.9rem"><label class="field" id="gcf" style="opacity:' + (a ? "1" : ".4") + '">' +
          '<span>How many in your party (incl. you)?</span><input id="gc" type="number" min="0" value="' + esc(gc) + '" /></label></div>' +
        '<label class="field"><span>Note (optional)</span><input id="rnote" type="text" maxlength="160" value="' + esc(note) + '" placeholder="e.g. arriving after 2pm" /></label>' +
        '<button class="btn btn--gold" id="savr">Save my RSVP</button><p class="msg" id="rmsg"></p></div>';
    }

    function potluckSection(ev, contribs) {
      const cats = ["food", "drink", "dessert", "supplies", "other"];
      let groups = "";
      cats.forEach((c) => {
        const items = contribs.filter((x) => x.category === c);
        if (!items.length) return;
        groups += '<div class="catgroup"><h3>' + c + "</h3>" +
          items.map((x) =>
            '<div class="item"><div><strong>' + esc(x.item) + "</strong>" + (x.note ? ' <span class="who">— ' + esc(x.note) + "</span>" : "") +
            '<div class="who">by ' + esc(x.owner_name || "a family member") + "</div></div>" +
            (x.owner_id === ME.id || isAdmin() ? '<button class="del" data-delc="' + x.id + '">remove</button>' : "") +
            "</div>").join("") + "</div>";
      });
      return '<div class="card"><h2>What I\'m Bringing</h2>' +
        '<p class="lede">Claim a dish or supplies so we don\'t double up. 🥔</p>' +
        '<div class="row">' +
          '<label class="field" style="flex:0 0 130px"><span>Category</span><select id="ccat">' +
            cats.map((c) => '<option value="' + c + '">' + c + "</option>").join("") + "</select></label>" +
          '<label class="field"><span>Item</span><input id="citem" type="text" maxlength="80" placeholder="e.g. Potato salad" /></label>' +
          '<label class="field"><span>Note</span><input id="cnote" type="text" maxlength="80" placeholder="(optional)" /></label>' +
        "</div>" +
        '<button class="btn btn--gold" id="addc">Add to the list</button><p class="msg" id="cmsg"></p>' +
        (groups || '<p class="empty" style="margin-top:1rem">Nothing on the list yet — add the first item!</p>') + "</div>";
    }

    function volunteerSection(ev, roles, signups) {
      const byRole = {};
      signups.forEach((s) => (byRole[s.role_id] = byRole[s.role_id] || []).push(s));
      const rows = roles.map((r) => {
        const sgn = byRole[r.id] || [];
        const mine = sgn.some((s) => s.member_id === ME.id);
        const names = sgn.length ? '<div class="chiplist">' + sgn.map((s) => '<span class="nchip">' + esc(s.member_name || "Member") + "</span>").join("") + "</div>" : '<div class="empty">No volunteers yet</div>';
        return '<div class="vrole"><div class="rolehead"><h3>' + esc(r.name) + "</h3>" +
          (canManageEvent(ev) ? '<button class="delrole" data-delrole="' + r.id + '">remove role</button>' : "") + "</div>" +
          (r.description ? '<div class="desc">' + esc(r.description) + "</div>" : "") + names +
          '<button class="btn btn--sm ' + (mine ? "btn--outline" : "btn--gold") + '" data-vol="' + r.id + '" data-mine="' + (mine ? "1" : "0") + '">' +
            (mine ? "✓ I'm signed up — withdraw" : "I'll help") + "</button></div>";
      }).join("");
      const addRole = canManageEvent(ev) ?
        '<div class="subhead">ADD A ROLE</div><div class="row">' +
          '<label class="field"><span>Role name</span><input id="rolename" type="text" maxlength="60" placeholder="e.g. Photographer" /></label>' +
          '<label class="field"><span>Description</span><input id="roledesc" type="text" maxlength="120" placeholder="(optional)" /></label>' +
        '</div><button class="btn btn--outline btn--sm" id="addrole">Add role</button><p class="msg" id="rolemsg"></p>' : "";
      return '<div class="card"><h2>Volunteer</h2><p class="lede">Many hands make a great gathering. Sign up to help with:</p>' +
        (rows || '<p class="empty">No roles yet.</p>') + addRole + "</div>";
    }

    /* ---------- create-event forms ---------- */
    function sectionChecks() {
      return '<div class="subhead">SECTIONS FOR THIS EVENT</div><div class="checks">' +
        '<label><input type="checkbox" id="en_rsvp" checked /> RSVP</label>' +
        '<label><input type="checkbox" id="en_potluck" checked /> What I\'m Bringing</label>' +
        '<label><input type="checkbox" id="en_volunteer" checked /> Volunteer</label></div>';
    }
    function createForm(kind) {
      if (kind === "birth") {
        return '<div class="card"><h2>👶 Add a Birth Notice</h2>' +
          '<p class="lede">Welcome the newest Miller. This becomes its own event — add baby-shower details and the family can RSVP, bring things, and volunteer.</p>' +
          '<label class="field"><span>Baby\'s name *</span><input id="f_baby" type="text" maxlength="80" placeholder="e.g. Ava Rose Miller" /></label>' +
          '<div class="row">' +
            '<label class="field"><span>Date of birth</span><input id="f_bdate" type="date" /></label>' +
            '<label class="field"><span>Parents</span><input id="f_parents" type="text" maxlength="120" placeholder="e.g. John & Maria Miller" /></label>' +
          "</div>" +
          '<label class="field"><span>Details (weight, length, a note…)</span><textarea id="f_details" rows="2" maxlength="600"></textarea></label>' +
          '<div class="subhead">BABY SHOWER / GATHERING (optional)</div>' +
          '<div class="row">' +
            '<label class="field"><span>Date</span><input id="f_date" type="date" /></label>' +
            '<label class="field"><span>Time</span><input id="f_time" type="text" maxlength="40" placeholder="e.g. 2:00 PM" /></label>' +
          "</div>" +
          '<label class="field"><span>Location</span><input id="f_loc" type="text" maxlength="160" placeholder="e.g. Grandma\'s house" /></label>' +
          '<label class="field"><span>Registry / gift-list links (one per line)</span><textarea id="f_registry" rows="2" maxlength="1000" placeholder="https://www.babylist.com/…"></textarea></label>' +
          sectionChecks() +
          '<button class="btn btn--gold" id="createev">Create birth event</button><p class="msg" id="createmsg"></p></div>';
      }
      if (kind === "graduation") {
        return '<div class="card"><h2>🎓 Add a Graduation</h2>' +
          '<p class="lede">Celebrate a graduate! This becomes its own event — the family can RSVP, bring food, and volunteer.</p>' +
          '<label class="field"><span>Graduate\'s name *</span><input id="f_grad" type="text" maxlength="100" placeholder="e.g. Jordan Miller" /></label>' +
          '<div class="row">' +
            '<label class="field"><span>School</span><input id="f_school" type="text" maxlength="140" placeholder="e.g. Penn State" /></label>' +
            '<label class="field"><span>Degree / honor</span><input id="f_degree" type="text" maxlength="140" placeholder="e.g. B.S. Nursing / High School Diploma" /></label>' +
          "</div>" +
          '<div class="subhead">CEREMONY / PARTY</div>' +
          '<div class="row">' +
            '<label class="field"><span>Date</span><input id="f_date" type="date" /></label>' +
            '<label class="field"><span>Time</span><input id="f_time" type="text" maxlength="40" placeholder="e.g. 3:00 PM" /></label>' +
          "</div>" +
          '<label class="field"><span>Location</span><input id="f_loc" type="text" maxlength="200" placeholder="Venue / address" /></label>' +
          '<label class="field"><span>Details (optional)</span><textarea id="f_details" rows="2" maxlength="600"></textarea></label>' +
          '<label class="field"><span>Registry / gift-list links (one per line)</span><textarea id="f_registry" rows="2" maxlength="1000" placeholder="(optional)"></textarea></label>' +
          sectionChecks() +
          '<button class="btn btn--gold" id="createev">Create graduation event</button><p class="msg" id="createmsg"></p></div>';
      }
      if (kind === "wedding") {
        return '<div class="card"><h2>💍 Add a Wedding</h2>' +
          '<p class="lede">Everything the family needs for the big day — ceremony, the lead-up events, the wedding party, and the registry.</p>' +
          '<label class="field"><span>Couple *</span><input id="f_couple" type="text" maxlength="140" placeholder="e.g. Jordan &amp; Taylor Miller" /></label>' +
          '<div class="subhead">CEREMONY</div>' +
          '<div class="row">' +
            '<label class="field"><span>Date</span><input id="f_date" type="date" /></label>' +
            '<label class="field"><span>Time</span><input id="f_time" type="text" maxlength="40" placeholder="e.g. 4:00 PM" /></label>' +
          "</div>" +
          '<label class="field"><span>Venue / location</span><input id="f_loc" type="text" maxlength="200" placeholder="Ceremony &amp; reception venue" /></label>' +
          '<label class="field"><span>Details (optional)</span><textarea id="f_details" rows="2" maxlength="600" placeholder="Dress code, hotel block, notes…"></textarea></label>' +
          '<div class="subhead">LEAD-UP EVENTS (optional)</div>' +
          '<div class="row"><label class="field"><span>Bridal shower — date</span><input id="f_bsd" type="date" /></label>' +
            '<label class="field"><span>Bridal shower — time &amp; place</span><input id="f_bsw" type="text" maxlength="160" /></label></div>' +
          '<div class="row"><label class="field"><span>Bachelor party — date</span><input id="f_bpd" type="date" /></label>' +
            '<label class="field"><span>Bachelor — time &amp; place</span><input id="f_bpw" type="text" maxlength="160" /></label></div>' +
          '<div class="row"><label class="field"><span>Bachelorette — date</span><input id="f_bted" type="date" /></label>' +
            '<label class="field"><span>Bachelorette — time &amp; place</span><input id="f_btew" type="text" maxlength="160" /></label></div>' +
          '<div class="row"><label class="field"><span>Rehearsal — date</span><input id="f_rd" type="date" /></label>' +
            '<label class="field"><span>Rehearsal — time &amp; place</span><input id="f_rw" type="text" maxlength="160" /></label></div>' +
          '<div class="row"><label class="field"><span>Dress fitting — date</span><input id="f_dfd" type="date" /></label>' +
            '<label class="field"><span>Suit fitting — date</span><input id="f_sfd" type="date" /></label></div>' +
          '<label class="field"><span>Wedding party (one name per line)</span><textarea id="f_party" rows="3" maxlength="1500" placeholder="Maid of Honor: …&#10;Best Man: …&#10;Bridesmaids: …&#10;Groomsmen: …"></textarea></label>' +
          '<label class="field"><span>Registry / gift-list links (one per line)</span><textarea id="f_registry" rows="2" maxlength="1000" placeholder="https://…"></textarea></label>' +
          sectionChecks() +
          '<button class="btn btn--gold" id="createev">Create wedding event</button><p class="msg" id="createmsg"></p></div>';
      }
      return '<div class="card"><h2>🕊️ Add a Death Notice</h2>' +
        '<p class="lede">Honor a loved one. This becomes its own event with service, burial, and eulogy details — and the family can RSVP, bring food, and volunteer.</p>' +
        '<label class="field"><span>Name *</span><input id="f_name" type="text" maxlength="100" placeholder="e.g. Loyd Miller Sr." /></label>' +
        '<div class="row">' +
          '<label class="field"><span>Born</span><input id="f_born" type="date" /></label>' +
          '<label class="field"><span>Passed</span><input id="f_died" type="date" /></label>' +
        "</div>" +
        '<div class="subhead">SERVICE / GATHERING</div>' +
        '<div class="row">' +
          '<label class="field"><span>Date</span><input id="f_date" type="date" /></label>' +
          '<label class="field"><span>Time</span><input id="f_time" type="text" maxlength="40" placeholder="e.g. 11:00 AM" /></label>' +
        "</div>" +
        '<label class="field"><span>Service location</span><input id="f_loc" type="text" maxlength="200" placeholder="Funeral home / church" /></label>' +
        '<label class="field"><span>Burial / resting place</span><input id="f_burial" type="text" maxlength="200" placeholder="Cemetery name & location" /></label>' +
        '<label class="field"><span>Eulogy (optional)</span><textarea id="f_eulogy" rows="4" maxlength="4000" placeholder="A few words in their memory…"></textarea></label>' +
        '<label class="field"><span>Other notes</span><textarea id="f_details" rows="2" maxlength="600"></textarea></label>' +
        sectionChecks() +
        '<button class="btn btn--gold" id="createev">Create memorial event</button><p class="msg" id="createmsg"></p></div>';
    }

    /* ---------- render ---------- */
    async function render() {
      let html = menuCard();
      if (typeof CUR === "string" && CUR.indexOf("new-") === 0) {
        const kind = CUR.slice(4);
        html += createForm(kind);
        wrap.innerHTML = html; wireMenu(); wireCreate(kind);
        return;
      }
      if (!CUR) { wrap.innerHTML = html + landing(); wireMenu(); wireLanding(); return; }
      const ev = EVENTS.find((e) => e.id === CUR);
      if (!ev) { wrap.innerHTML = html + landing(); wireMenu(); wireLanding(); return; }
      html += '<button class="btn btn--outline btn--sm" id="backall" style="margin-bottom:.8rem">← All events</button>' +
        eventHeader(ev) + tabsHTML(ev) + '<div id="sec"><div class="card"><p class="empty">Loading…</p></div></div>';
      wrap.innerHTML = html;
      wireMenu(); wireHeader(); wireTabs(ev);
      renderSection(ev);
    }

    function wireLanding() {
      wrap.querySelectorAll("[data-openevent]").forEach((b) => b.addEventListener("click", () => {
        CUR = b.dataset.openevent; SEC = "details"; syncUrl(); render();
      }));
      wrap.querySelectorAll("[data-addk]").forEach((b) => b.addEventListener("click", () => {
        CUR = b.dataset.addk; SEC = "details"; syncUrl(); render();
      }));
    }

    async function renderSection(ev) {
      const sec = document.getElementById("sec");
      if (!sec) return;
      if (SEC === "details") { sec.innerHTML = detailsSection(ev); return; }
      if (SEC === "rsvp") {
        const [mine, list] = await Promise.all([MillerDB.getMyEventRsvp(ev.id), MillerDB.listEventRsvps(ev.id)]);
        sec.innerHTML = rsvpSection(ev, mine, list.data || []); wireRsvp(ev); return;
      }
      if (SEC === "potluck") {
        const items = await MillerDB.listEventContributions(ev.id);
        sec.innerHTML = potluckSection(ev, items.data || []); wirePotluck(ev); return;
      }
      if (SEC === "volunteer") {
        const roles = (await MillerDB.listEventVolunteerRoles(ev.id)).data || [];
        const signups = (await MillerDB.listEventVolunteerSignups(roles.map((r) => r.id))).data || [];
        sec.innerHTML = volunteerSection(ev, roles, signups); wireVolunteer(ev); return;
      }
    }

    /* ---------- wiring ---------- */
    function wireMenu() {
      const nav = document.getElementById("nav");
      if (nav) nav.addEventListener("change", () => { CUR = nav.value || null; SEC = "details"; syncUrl(); render(); });
    }
    function wireHeader() {
      const back = document.getElementById("backall");
      if (back) back.addEventListener("click", () => { CUR = null; SEC = "details"; syncUrl(); render(); });
      wrap.querySelectorAll("[data-delevent]").forEach((b) => b.addEventListener("click", async () => {
        if (!confirm("Delete this event and all its RSVPs, potluck and volunteer sign-ups? This can't be undone.")) return;
        const { error } = await MillerDB.deleteEvent(b.dataset.delevent);
        if (error) { alert("Could not delete: " + error.message); return; }
        await loadEvents();
        CUR = null; SEC = "details"; syncUrl(); render();
      }));
    }
    function wireTabs(ev) {
      wrap.querySelectorAll("[data-tab]").forEach((b) => b.addEventListener("click", () => {
        SEC = b.dataset.tab; syncUrl();
        wrap.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t === b));
        renderSection(ev);
      }));
    }
    function wireRsvp(ev) {
      wrap.querySelectorAll("#att button").forEach((b) => b.addEventListener("click", () => {
        ATTEND = b.dataset.a === "1";
        wrap.querySelectorAll("#att button").forEach((x) => x.classList.toggle("on", x === b));
        document.getElementById("gcf").style.opacity = ATTEND ? "1" : ".4";
      }));
      const savr = document.getElementById("savr");
      if (savr) savr.addEventListener("click", async () => {
        const gc = ATTEND ? (parseInt(document.getElementById("gc").value, 10) || 1) : 0;
        const note = document.getElementById("rnote").value.trim();
        const m = document.getElementById("rmsg"); m.textContent = "Saving…"; m.className = "msg";
        const { error } = await MillerDB.saveEventRsvp(ev.id, { attending: ATTEND, guest_count: gc, note });
        if (error) { m.textContent = "Could not save: " + error.message; m.className = "msg err"; return; }
        renderSection(ev);
      });
    }
    function wirePotluck(ev) {
      const addc = document.getElementById("addc");
      if (addc) addc.addEventListener("click", async () => {
        const item = document.getElementById("citem").value.trim();
        const category = document.getElementById("ccat").value;
        const note = document.getElementById("cnote").value.trim();
        const m = document.getElementById("cmsg");
        if (!item) { m.textContent = "Please enter what you're bringing."; m.className = "msg err"; return; }
        m.textContent = "Adding…"; m.className = "msg";
        const { error } = await MillerDB.addEventContribution(ev.id, { item, category, note });
        if (error) { m.textContent = "Could not add: " + error.message; m.className = "msg err"; return; }
        renderSection(ev);
      });
      wrap.querySelectorAll("[data-delc]").forEach((b) => b.addEventListener("click", async () => {
        await MillerDB.deleteEventContribution(b.dataset.delc); renderSection(ev);
      }));
    }
    function wireVolunteer(ev) {
      wrap.querySelectorAll("[data-vol]").forEach((b) => b.addEventListener("click", async () => {
        b.disabled = true;
        const id = b.dataset.vol;
        const res = b.dataset.mine === "1" ? await MillerDB.withdrawEventVolunteer(id) : await MillerDB.signupEventVolunteer(id);
        if (res.error) { b.disabled = false; alert("Could not update: " + res.error.message); return; }
        renderSection(ev);
      }));
      wrap.querySelectorAll("[data-delrole]").forEach((b) => b.addEventListener("click", async () => {
        if (!confirm("Remove this volunteer role and its sign-ups?")) return;
        await MillerDB.deleteEventVolunteerRole(b.dataset.delrole); renderSection(ev);
      }));
      const addrole = document.getElementById("addrole");
      if (addrole) addrole.addEventListener("click", async () => {
        const name = document.getElementById("rolename").value.trim();
        const description = document.getElementById("roledesc").value.trim();
        const m = document.getElementById("rolemsg");
        if (!name) { m.textContent = "Enter a role name."; m.className = "msg err"; return; }
        const { error } = await MillerDB.addEventVolunteerRole(ev.id, { name, description });
        if (error) { m.textContent = "Could not add: " + error.message; m.className = "msg err"; return; }
        renderSection(ev);
      });
    }
    function wireCreate(kind) {
      const btn = document.getElementById("createev");
      if (!btn) return;
      btn.addEventListener("click", async () => {
        const m = document.getElementById("createmsg");
        const val = (id) => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
        const dateVal = (id) => { const el = document.getElementById(id); return el && el.value ? el.value : null; };
        const en = (id) => { const el = document.getElementById(id); return el ? el.checked : true; };
        const payload = {
          kind,
          event_date: dateVal("f_date"),
          start_time: val("f_time") || null,
          location: val("f_loc") || null,
          details: val("f_details") || null,
          rsvp_enabled: en("en_rsvp"), potluck_enabled: en("en_potluck"), volunteer_enabled: en("en_volunteer"),
        };
        if (kind === "birth") {
          const baby = val("f_baby");
          if (!baby) { m.textContent = "Please enter the baby's name."; m.className = "msg err"; return; }
          payload.title = baby; payload.baby_name = baby;
          payload.birth_date = dateVal("f_bdate"); payload.parents = val("f_parents") || null;
          payload.registry_url = val("f_registry") || null;
        } else if (kind === "graduation") {
          const grad = val("f_grad");
          if (!grad) { m.textContent = "Please enter the graduate's name."; m.className = "msg err"; return; }
          payload.title = grad;
          payload.school = val("f_school") || null; payload.degree = val("f_degree") || null;
          payload.registry_url = val("f_registry") || null;
        } else if (kind === "wedding") {
          const couple = val("f_couple");
          if (!couple) { m.textContent = "Please enter the couple."; m.className = "msg err"; return; }
          payload.title = couple;
          payload.wedding_party = val("f_party") || null;
          payload.registry_url = val("f_registry") || null;
          payload.bridal_shower_date = dateVal("f_bsd"); payload.bridal_shower_where = val("f_bsw") || null;
          payload.bachelor_date = dateVal("f_bpd"); payload.bachelor_where = val("f_bpw") || null;
          payload.bachelorette_date = dateVal("f_bted"); payload.bachelorette_where = val("f_btew") || null;
          payload.rehearsal_date = dateVal("f_rd"); payload.rehearsal_where = val("f_rw") || null;
          payload.dress_fitting_date = dateVal("f_dfd"); payload.suit_fitting_date = dateVal("f_sfd");
        } else {
          const name = val("f_name");
          if (!name) { m.textContent = "Please enter a name."; m.className = "msg err"; return; }
          payload.title = name;
          payload.born_date = dateVal("f_born"); payload.death_date = dateVal("f_died");
          payload.service_at = null; payload.service_location = val("f_loc") || null;
          payload.burial_location = val("f_burial") || null; payload.eulogy = val("f_eulogy") || null;
        }
        m.textContent = "Creating…"; m.className = "msg";
        const { data, error } = await MillerDB.createEvent(payload);
        if (error) { m.textContent = "Could not create: " + error.message; m.className = "msg err"; return; }
        await loadEvents();
        CUR = data.id; SEC = "details"; syncUrl(); render();
      });
    }

    async function loadEvents() {
      const res = await MillerDB.listEvents();
      EVENTS = res.data || [];
    }

    (async function init() {
      if (!MillerDB.configured) { wrap.innerHTML = '<div class="state"><h2>Not connected yet</h2><p><a href="index.html">Back to the family page</a></p></div>'; return; }
      await new Promise((r) => setTimeout(r, 250));
      const session = await MillerDB.getSession();
      if (!session) { location.href = "login.html"; return; }
      ME = await MillerDB.getProfile();
      if (!ME) { wrap.innerHTML = '<div class="state"><p>Finishing sign-in… <a href="event.html">refresh</a>.</p></div>'; return; }
      if (ME.status !== "active") {
        wrap.innerHTML = '<div class="state"><h2>Almost there!</h2><p>Your access is pending approval. Once an elder approves you, you can RSVP here.</p><p><a class="btn btn--gold" href="login.html">My Account</a></p></div>';
        return;
      }
      await loadEvents();
      const valid = CUR && ((typeof CUR === "string" && CUR.indexOf("new-") === 0) || EVENTS.some((e) => e.id === CUR));
      if (!valid) CUR = null;   // default to the "all events" landing list
      render();
    })();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Sign In · Miller Family</title>
  <meta name="theme-color" content="#3B0A58" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    body { background: linear-gradient(160deg, var(--purple-900), var(--purple-600)); min-height: 100vh; color: #fff; }
    .auth { max-width: 460px; margin: 0 auto; padding: 2.4rem 1.2rem calc(2.4rem + env(safe-area-inset-bottom,0px)); }
    .auth__brand { text-align: center; margin-bottom: 1.6rem; }
    .auth__brand .script { color: var(--gold); font-size: clamp(2rem, 9vw, 3rem); display: block; line-height: 1; }
    .auth__brand .display { font-family: "Cinzel", serif; letter-spacing: .1em; font-size: .8rem; color: #e9dcff; }
    .panel { background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.16); border-radius: var(--radius); padding: 1.6rem; backdrop-filter: blur(4px); }
    .panel h1 { font-family: "Cinzel", serif; font-size: 1.3rem; margin: 0 0 .4rem; }
    .panel p { color: #e9dcff; }
    .field { display: block; margin: 1rem 0; }
    .field span { font-family: "Cinzel", serif; font-size: .8rem; letter-spacing: .04em; display: block; margin-bottom: .35rem; }
    .field input { width: 100%; padding: .8rem .9rem; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.95); color: var(--ink); font: inherit; font-family: Georgia, serif; }
    .field input:focus { outline: 2px solid var(--gold); }
    .btn--block { width: 100%; }
    .msg { min-height: 1.3em; margin-top: .9rem; font-family: "Cinzel", serif; font-size: .9rem; }
    .msg.ok { color: var(--gold-soft); } .msg.err { color: #ffb4b4; }
    .quiet { color: #cdb8e6; font-size: .85rem; text-align: center; margin-top: 1.4rem; }
    .quiet a { color: var(--gold-soft); }
    .divider { border: 0; border-top: 1px solid rgba(255,255,255,.15); margin: 1.4rem 0; }
    .role-chip { display:inline-block; background: rgba(230,180,34,.2); border:1px solid rgba(230,180,34,.5); color: var(--gold-soft); border-radius:999px; padding:.15rem .7rem; font-family:"Cinzel",serif; font-size:.75rem; letter-spacing:.05em; }
    .applinks { display:grid; gap:.6rem; margin-top:1rem; }
    .field select { width:100%; padding:.8rem .9rem; border-radius:12px; border:1px solid rgba(255,255,255,.3); background:rgba(255,255,255,.95); color:var(--ink); font:inherit; font-family:Georgia,serif; }
  </style>
</head>
<body>
  <div class="auth">
    <div class="auth__brand">
      <span class="script">Miller Family</span>
      <span class="display">FAMILY &amp; FRIENDS HUB</span>
    </div>

    <div class="panel" id="panel">
      <h1>Loading…</h1>
    </div>

    <p class="quiet"><a href="index.html">← Back to the family page</a></p>
  </div>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/notify.js"></script>
  <script>
    const panel = document.getElementById("panel");
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

    function render(html) { panel.innerHTML = html; }

    function notConfigured() {
      render(
        '<h1>Not connected yet</h1>' +
        "<p>The family hub backend isn't connected yet. Once it's live, you'll sign in here with your email.</p>" +
        '<p><a href="index.html" style="color:var(--gold-soft);font-weight:600;">Request access →</a></p>'
      );
    }

    function signInForm(msg, msgClass) {
      render(
        '<h1>Family Sign In</h1>' +
        "<p>Sign in with the email and password your family admin gave you.</p>" +
        '<form id="login-form">' +
          '<label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email" placeholder="you@example.com" /></label>' +
          '<label class="field"><span>Password</span><input type="password" name="password" required autocomplete="current-password" placeholder="Your password" /></label>' +
          '<button class="btn btn--gold btn--block" type="submit">Sign In</button>' +
          '<p class="msg ' + (msgClass || "") + '" id="msg">' + (msg || "") + "</p>" +
        "</form>" +
        '<hr class="divider" />' +
        '<p class="quiet">New here? <a href="index.html">Request access →</a><br />' +
        'Forgot your password? <a href="#" id="forgot">Recover it with your security questions →</a></p>'
      );
      const fg = document.getElementById("forgot");
      if (fg) fg.addEventListener("click", (e) => { e.preventDefault(); recoveryView(); });
      document.getElementById("login-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = e.target.email.value.trim();
        const password = e.target.password.value;
        const m = document.getElementById("msg");
        m.textContent = "Signing in…"; m.className = "msg";
        const { error } = await MillerDB.signInWithPassword(email, password);
        if (error) {
          m.textContent = /invalid/i.test(error.message || "") ? "Email or password is incorrect." : (error.message || "Could not sign in.");
          m.className = "msg err";
          return;
        }
        location.reload();
      });
    }

    function pendingView(profile) {
      render(
        '<h1>Almost there!</h1>' +
        "<p>You're signed in as <strong>" + esc(profile.email) + "</strong>, but your access is <strong>pending approval</strong> by a family admin or elder.</p>" +
        "<p>Have an <strong>invite code</strong>? Enter it to unlock access right away:</p>" +
        '<form id="redeem-form">' +
          '<label class="field"><span>Invite code</span><input name="code" placeholder="ABCD-EF23" autocomplete="off" /></label>' +
          '<button class="btn btn--gold btn--block" type="submit">Unlock Access</button>' +
          '<p class="msg" id="msg"></p>' +
        "</form>" +
        '<hr class="divider" />' +
        '<button class="btn btn--outline btn--block" id="signout">Sign Out</button>'
      );
      document.getElementById("signout").addEventListener("click", async () => { await MillerDB.signOut(); location.reload(); });
      document.getElementById("redeem-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const code = e.target.code.value.trim().toUpperCase();
        const m = document.getElementById("msg");
        m.textContent = "Checking…"; m.className = "msg";
        const { data, error } = await MillerDB.redeemInvite(code);
        if (error) { m.textContent = "Something went wrong. Try again."; m.className = "msg err"; return; }
        const map = { ok: null, invalid: "That code isn't valid.", expired: "That code has expired.", wrong_email: "That code was issued for a different email.", not_signed_in: "Please sign in again." };
        if (data === "ok") { location.reload(); }
        else { m.textContent = map[data] || "That code could not be used."; m.className = "msg err"; }
      });
    }

    function activeView(profile) {
      const reviewer = profile.role === "admin" || profile.role === "elder";
      render(
        '<h1>Welcome, ' + esc((profile.full_name || profile.email).split(" ")[0]) + '! 💜</h1>' +
        '<p>You\'re signed in. <span class="role-chip">' + esc(profile.role) + "</span></p>" +
        '<div class="applinks">' +
          '<a class="btn btn--gold btn--block" href="tree.html">🌳 Explore the Family Tree</a>' +
          '<a class="btn btn--gold btn--block" href="photos.html">📸 Family Photos</a>' +
          '<a class="btn btn--gold btn--block" href="event.html">🎉 Family Events (RSVP, births, memorials)</a>' +
          '<a class="btn btn--gold btn--block" href="board.html">📝 Post What\'s on Your Mind</a>' +
          '<a class="btn btn--gold btn--block" href="chat.html">💬 Family Chat</a>' +
          (reviewer ? '<a class="btn btn--outline btn--block" href="admin.html">Admin / Approvals Panel</a>' : "") +
        "</div>" +
        '<hr class="divider" />' +
        '<button class="btn btn--outline btn--block" id="enablenotif">🔔 Turn on message notifications</button>' +
        '<p class="quiet" id="notifmsg" style="margin-top:.4rem"></p>' +
        '<button class="btn btn--outline btn--block" id="changepw" style="margin-top:.6rem">Change my password</button>' +
        '<div id="pwbox"></div>' +
        '<button class="btn btn--outline btn--block" id="signout" style="margin-top:.6rem">Sign Out</button>'
      );
      document.getElementById("signout").addEventListener("click", async () => { await MillerDB.signOut(); location.reload(); });

      (function notifBtn() {
        const en = document.getElementById("enablenotif");
        const nm = document.getElementById("notifmsg");
        if (!en) return;
        function reflect() {
          const st = window.MillerNotify ? MillerNotify.pushState() : "unsupported";
          if (st === "granted") { en.textContent = "🔔 Notifications on — tap to re-sync this device"; en.disabled = false; }
          else if (st === "denied") { en.textContent = "🔔 Notifications are blocked"; en.disabled = true; nm.textContent = "Re-enable them in your browser/site settings, then reload."; }
          else if (st === "unsupported") { en.textContent = "🔔 Notifications not available here"; en.disabled = true; nm.textContent = "On iPhone, install the app to your Home Screen first (Share → Add to Home Screen), open it from that icon, then try again."; }
          else { en.textContent = "🔔 Turn on message notifications"; en.disabled = false; nm.textContent = ""; }
        }
        reflect();
        en.addEventListener("click", async () => {
          en.disabled = true; nm.textContent = "Setting up…"; nm.className = "quiet";
          const res = window.MillerNotify ? await MillerNotify.enablePush() : { ok: false, error: "Not ready — reload and try again." };
          nm.textContent = res.ok ? "All set! This device will get message pings. 🎉" : ("⚠️ " + res.error);
          reflect();
        });
      })();
      document.getElementById("changepw").addEventListener("click", () => {
        const box = document.getElementById("pwbox");
        if (box.dataset.open === "1") { box.innerHTML = ""; box.dataset.open = ""; return; }
        box.dataset.open = "1";
        box.innerHTML =
          '<form id="pwform" style="margin-top:.6rem">' +
            '<label class="field"><span>New password (at least 8 characters)</span>' +
            '<input type="password" name="pw" minlength="8" required autocomplete="new-password" /></label>' +
            '<button class="btn btn--gold btn--block" type="submit">Update password</button>' +
            '<p class="msg" id="pwmsg"></p></form>';
        document.getElementById("pwform").addEventListener("submit", async (e) => {
          e.preventDefault();
          const pw = e.target.pw.value;
          const pm = document.getElementById("pwmsg");
          pm.textContent = "Updating…"; pm.className = "msg";
          const { error } = await MillerDB.updatePassword(pw);
          if (error) { pm.textContent = error.message || "Could not update."; pm.className = "msg err"; return; }
          pm.textContent = "Password updated! Use it next time you sign in."; pm.className = "msg ok";
        });
      });

      (async function maybePromptQuestions() {
        let has = true;
        try { has = await MillerDB.hasSecurityQuestions(); } catch (_) { has = true; }
        if (has) return;
        const card = document.createElement("div");
        card.innerHTML =
          '<hr class="divider" />' +
          '<div id="sqsetup"><h1 style="font-size:1.05rem">🔐 Set up password recovery</h1>' +
          '<p class="quiet" style="text-align:left">Answer 3 questions so you can reset your own password later — no admin needed.</p>' +
          '<form id="sqform">' + securityQuestionsFormHTML("s_") +
            '<button class="btn btn--gold btn--block" type="submit">Save recovery questions</button>' +
            '<button class="btn btn--outline btn--block" id="sqskip" type="button" style="margin-top:.5rem">Skip for now</button>' +
            '<p class="msg" id="sqmsg"></p>' +
          "</form></div>";
        panel.appendChild(card);
        document.getElementById("sqskip").addEventListener("click", () => { const s = document.getElementById("sqsetup"); if (s) s.remove(); });
        document.getElementById("sqform").addEventListener("submit", async (e) => {
          e.preventDefault();
          const r = readSecurityQuestions(e.target, "s_");
          const m = document.getElementById("sqmsg");
          if (r.error) { m.textContent = r.error; m.className = "msg err"; return; }
          m.textContent = "Saving…"; m.className = "msg";
          const { data, error } = await MillerDB.setSecurityQuestions(r.questions, r.answers);
          if (error || data !== "ok") { m.textContent = "Could not save. Please try again."; m.className = "msg err"; return; }
          document.getElementById("sqsetup").innerHTML = '<hr class="divider" /><p class="msg ok">✅ Recovery questions saved. You can reset your own password anytime from the sign-in page.</p>';
        });
      })();
    }

    // ---- security-questions form helpers (shared by setup + recovery) ----
    function securityQuestionsFormHTML(prefix) {
      const bank = MillerDB.SECURITY_QUESTIONS;
      const sel = (i, def) => '<select name="' + prefix + "q" + i + '">' +
        bank.map((q, idx) => '<option value="' + esc(q) + '"' + (idx === def ? " selected" : "") + ">" + esc(q) + "</option>").join("") + "</select>";
      let h = "";
      for (let i = 1; i <= 3; i++) {
        h += '<label class="field"><span>Question ' + i + "</span>" + sel(i, i - 1) + "</label>" +
          '<label class="field"><span>Your answer</span><input name="' + prefix + "a" + i + '" autocomplete="off" required /></label>';
      }
      return h;
    }
    function readSecurityQuestions(form, prefix) {
      const q = [1, 2, 3].map((i) => ((form[prefix + "q" + i] && form[prefix + "q" + i].value) || "").trim());
      const a = [1, 2, 3].map((i) => ((form[prefix + "a" + i] && form[prefix + "a" + i].value) || "").trim());
      if (a.some((x) => !x)) return { error: "Please answer all three questions." };
      if (new Set(q).size < 3) return { error: "Please choose three different questions." };
      return { questions: q, answers: a };
    }

    function recoveryView() {
      render(
        "<h1>Recover your password</h1>" +
        "<p>Enter your email and we'll show your security questions.</p>" +
        '<form id="rc-email-form">' +
          '<label class="field"><span>Email</span><input type="email" name="email" required autocomplete="email" /></label>' +
          '<button class="btn btn--gold btn--block" type="submit">Find my questions</button>' +
          '<p class="msg" id="rc-msg"></p>' +
        "</form>" +
        '<hr class="divider" /><p class="quiet"><a href="#" id="rc-back">← Back to sign in</a></p>'
      );
      document.getElementById("rc-back").addEventListener("click", (e) => { e.preventDefault(); signInForm(); });
      document.getElementById("rc-email-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const email = e.target.email.value.trim();
        const m = document.getElementById("rc-msg");
        m.textContent = "Looking up…"; m.className = "msg";
        const { data, error } = await MillerDB.getRecoveryQuestions(email);
        if (error || !data || !data.ok) {
          m.textContent = (data && data.error === "not_found")
            ? "No recovery questions are set up for that email. Please ask a family admin to reset your password."
            : "Could not look that up. Please try again.";
          m.className = "msg err"; return;
        }
        recoveryAnswerView(email, data.questions);
      });
    }
    function recoveryAnswerView(email, questions) {
      render(
        "<h1>Answer your questions</h1>" +
        '<form id="rc-reset-form">' +
          questions.map((q, i) => '<label class="field"><span>' + esc(q) + '</span><input name="a' + (i + 1) + '" autocomplete="off" required /></label>').join("") +
          '<label class="field"><span>New password (at least 8 characters)</span><input type="password" name="pw" minlength="8" required autocomplete="new-password" /></label>' +
          '<label class="field"><span>Confirm new password</span><input type="password" name="pw2" minlength="8" required autocomplete="new-password" /></label>' +
          '<button class="btn btn--gold btn--block" type="submit">Reset my password</button>' +
          '<p class="msg" id="rc-msg"></p>' +
        "</form>" +
        '<hr class="divider" /><p class="quiet"><a href="#" id="rc-back">← Back to sign in</a></p>'
      );
      document.getElementById("rc-back").addEventListener("click", (e) => { e.preventDefault(); signInForm(); });
      document.getElementById("rc-reset-form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const f = e.target;
        const answers = [f.a1.value.trim(), f.a2.value.trim(), f.a3.value.trim()];
        const m = document.getElementById("rc-msg");
        if (f.pw.value !== f.pw2.value) { m.textContent = "Passwords don't match."; m.className = "msg err"; return; }
        m.textContent = "Checking…"; m.className = "msg";
        const { data, error } = await MillerDB.resetPasswordWithAnswers(email, answers, f.pw.value);
        if (error || !data || !data.ok) {
          const map = { wrong_answers: "One or more answers are incorrect.", locked: "Too many tries. Please wait 15 minutes, then try again.", password_short: "Password must be at least 8 characters.", not_found: "Recovery isn't set up for that email.", need_three: "Please answer all three questions." };
          m.textContent = (data && map[data.error]) || "Could not reset. Please try again."; m.className = "msg err"; return;
        }
        m.textContent = "Password reset! Redirecting to sign in…"; m.className = "msg ok";
        setTimeout(() => signInForm("Password reset — please sign in with your new password.", "ok"), 1400);
      });
    }

    (async function init() {
      if (!MillerDB.configured) return notConfigured();
      // Give supabase-js a moment to parse the magic-link hash on redirect.
      await new Promise((r) => setTimeout(r, 300));
      const session = await MillerDB.getSession();
      if (!session) return signInForm();
      const profile = await MillerDB.getProfile();
      if (!profile) { // profile row not created yet; brief retry
        await new Promise((r) => setTimeout(r, 800));
        const p2 = await MillerDB.getProfile();
        if (!p2) return signInForm("Signed in, finishing setup… refresh in a moment.", "ok");
        return p2.status === "active" ? activeView(p2) : pendingView(p2);
      }
      return profile.status === "active" ? activeView(profile) : pendingView(profile);
    })();
  </script>
</body>
</html>

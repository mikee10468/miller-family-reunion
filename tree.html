<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Family Tree · Miller Family</title>
  <meta name="theme-color" content="#3B0A58" />
  <link rel="icon" type="image/png" sizes="64x64" href="assets/icons/favicon-64.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
  <style>
    :root { --line: #b98bdd; }
    body { background: linear-gradient(180deg, #faf5ef, #f1e8f7); min-height: 100vh; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:1rem;
      background: linear-gradient(160deg, var(--purple-900), var(--purple-600)); color:#fff;
      padding: calc(env(safe-area-inset-top,0px) + .9rem) 1rem .9rem; position: sticky; top: env(safe-area-inset-top,0px); z-index: 20; }
    .topbar .script { font-family:"Great Vibes",cursive; color:var(--gold); font-size:1.7rem; line-height:1; }
    .topbar .sub { font-family:"Cinzel",serif; font-size:.7rem; letter-spacing:.1em; color:#e9dcff; }
    .topbar a.home { color:var(--gold-soft); text-decoration:none; font-family:"Cinzel",serif; font-size:.85rem; }
    .toolbar { display:flex; gap:.5rem; flex-wrap:wrap; align-items:center; padding:.8rem 1rem; }
    .hint { color:#6b5b7a; font-size:.85rem; }

    /* ---- Decorative tree (poster style) ---- */
    .tree-header { text-align:center; color:#fff; padding:1.7rem 1rem 1.5rem;
      background:radial-gradient(900px 400px at 50% -20%, rgba(230,180,34,.25), transparent 60%), linear-gradient(160deg,var(--purple-900),var(--purple-600));
      border-bottom:4px solid var(--gold); }
    .tree-header .doves { font-size:1.3rem; letter-spacing:.5rem; }
    .tree-header h1 { font-family:"Great Vibes",cursive; color:var(--gold); font-size:clamp(2rem,7vw,3.4rem); margin:.2rem 0 0; line-height:1; text-shadow:0 2px 10px rgba(0,0,0,.3); }
    .tree-header .tagline { font-family:"Cinzel",serif; letter-spacing:.08em; font-size:.78rem; color:#e9dcff; margin-top:.5rem; }
    .families { padding:1.4rem clamp(.5rem,2vw,1.2rem) 3rem; max-width:1600px; margin:0 auto; }
    body { -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; text-rendering:optimizeLegibility; }
    .family { margin:0 auto 2.6rem; }
    .ribbon { display:flex; align-items:center; justify-content:center; gap:.4rem; flex-wrap:wrap; margin:0 auto; max-width:640px;
      background:linear-gradient(180deg,var(--gold-soft),var(--gold)); color:#3a2a00; border:2px solid #b9892a; border-radius:16px;
      padding:.7rem 1.2rem; box-shadow:0 8px 20px rgba(230,180,34,.35); }
    .amp { color:#8a2b6b; font-weight:700; }
    .subbanner { text-align:center; margin:.8rem 0 1.1rem; }
    .subbanner span { display:inline-block; background:var(--purple-800); color:var(--gold-soft); font-family:"Cinzel",serif; font-size:.78rem; letter-spacing:.06em; padding:.3rem 1.1rem; border-radius:999px; }
    .cols { display:flex; gap:1rem; flex-wrap:nowrap; align-items:flex-start; overflow-x:auto; -webkit-overflow-scrolling:touch;
      padding:.3rem .2rem 1rem; scroll-snap-type:x proximity; }
    .cols::-webkit-scrollbar { height:10px; }
    .cols::-webkit-scrollbar-thumb { background:var(--gold); border-radius:999px; }
    .cols::-webkit-scrollbar-track { background:rgba(109,40,168,.12); border-radius:999px; }
    .col { flex:0 0 auto; width:250px; scroll-snap-align:start; background:#fbf6ee; border:2px solid var(--gold); border-radius:16px; overflow:hidden; box-shadow:0 6px 16px rgba(42,7,66,.14); }
    .scrollhint { text-align:center; color:#8a6a00; font-family:"Cinzel",serif; font-size:.72rem; letter-spacing:.05em; margin:.2rem 0 -.2rem; }
    .col__head { background:linear-gradient(180deg,var(--purple-600),var(--purple-800)); color:#fff; text-align:center; padding:.7rem .5rem; }
    .col__spouse { margin-top:.3rem; }
    .col__body { padding:.7rem .6rem 1rem; }
    .col__title { font-family:"Cinzel",serif; font-size:.72rem; color:var(--purple-600); text-align:center; margin:.2rem 0 .6rem; text-transform:uppercase; letter-spacing:.05em; }
    .col__empty { text-align:center; color:#b09; opacity:.5; font-style:italic; font-size:.8rem; padding:.3rem 0; }

    /* clickable person nodes (shared) */
    .node { border:0; cursor:pointer; font:inherit; background:transparent; display:inline-flex; align-items:center; gap:.35rem; text-align:left; transition:filter .15s; padding:0; }
    .node:hover { filter:brightness(1.06); }
    .node__photo { width:28px; height:28px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); background:#eee; flex:0 0 auto; }
    .node__av { flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%;
      color:#fff; font-family:"Cinzel",serif; font-size:.6rem; font-weight:700; box-shadow:0 0 0 2px #2ecc71, 0 1px 2px rgba(0,0,0,.25); }
    .treesearch { padding:.45rem .8rem; border-radius:999px; border:1px solid rgba(109,40,168,.35); font:inherit; font-family:Georgia,serif; min-width:160px; max-width:260px; }
    .subtreewrap { margin:.2rem 0 .4rem; }
    .subtreebtn { display:inline-flex; align-items:center; justify-content:center; width:1.7rem; height:1.7rem; background:#efe6f7; border:1px dashed var(--purple-600); color:#5a1e8c; border-radius:50%; padding:0; font-family:"Cinzel",serif; font-size:1rem; font-weight:700; line-height:1; cursor:pointer; }
    .subtreebtn:hover { background:#e6d6f7; }
    .subtreebtn.drill { background:transparent; border-style:solid; color:#6d28a8; margin-left:.25rem; font-size:.9rem; }
    .branchgrid { display:flex; flex-wrap:wrap; gap:.8rem; justify-content:center; margin:1rem 0; }
    .branchcard { flex:1 1 200px; max-width:260px; min-width:160px; background:#fff; border:1px solid rgba(109,40,168,.18); border-radius:14px;
      box-shadow:var(--shadow); padding:1rem; cursor:pointer; text-align:center; display:flex; flex-direction:column; align-items:center; gap:.3rem; font:inherit; transition:transform .1s, border-color .1s; }
    .branchcard:hover { border-color:var(--purple-600); transform:translateY(-2px); }
    .bc__photo { width:56px; height:56px; border-radius:50%; object-fit:cover; border:2px solid var(--gold); background:#f3ecfb; display:inline-flex; align-items:center; justify-content:center; font-size:1.6rem; }
    .bc__name { font-family:"Cinzel",serif; color:var(--purple-800); font-weight:700; line-height:1.2; }
    .bc__count { font-size:.78rem; color:#7a6a8a; }
    .bc__go { font-size:.78rem; color:var(--purple-600); font-family:"Cinzel",serif; }
    .bc__live { display:inline-flex; align-items:center; gap:.25rem; margin-top:.3rem; }
    .bc__liveav { display:inline-flex; align-items:center; justify-content:center; width:20px; height:20px; border-radius:50%;
      color:#fff; font-family:"Cinzel",serif; font-size:.55rem; font-weight:700; box-shadow:0 0 0 2px #2ecc71; margin-left:-4px; }
    .bc__liveav:first-child { margin-left:0; }
    .bc__livetxt { font-size:.7rem; color:#2e8b57; font-family:"Cinzel",serif; margin-left:.2rem; }
    .ancestor { text-align:center; margin:0 auto 1rem; }
    .ancestor__label { font-family:"Cinzel",serif; color:var(--purple-600); font-size:.8rem; letter-spacing:.05em; margin-bottom:.3rem; }
    /* faint tree silhouette behind the tree views */
    body::before { content:""; position:fixed; inset:0; z-index:-1; pointer-events:none; opacity:.24;
      background:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20240%20360%22%3E%3Cpath%20fill%3D%22%233B0A58%22%20d%3D%22M106%20360%20C101%20300%20117%20252%20112%20202%20C109%20172%20106%20150%20114%20116%20L128%20116%20C134%20150%20131%20174%20129%20202%20C126%20252%20139%20300%20134%20360%20Z%22%2F%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%233B0A58%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%3Cg%20stroke-width%3D%228%22%3E%3Cpath%20d%3D%22M118%20352%20C98%20352%2082%20346%2058%20332%22%2F%3E%3Cpath%20d%3D%22M122%20352%20C142%20352%20160%20346%20186%20334%22%2F%3E%3Cpath%20d%3D%22M120%20352%20C110%20354%2096%20356%2080%20350%22%2F%3E%3Cpath%20d%3D%22M122%20352%20C134%20354%20150%20358%20166%20352%22%2F%3E%3Cpath%20d%3D%22M115%20236%20C94%20230%2080%20220%2062%20200%20C54%20192%2048%20186%2040%20174%22%2F%3E%3Cpath%20d%3D%22M127%20214%20C150%20210%20168%20200%20184%20182%20C192%20174%20198%20168%20206%20160%22%2F%3E%3Cpath%20d%3D%22M115%20182%20C98%20176%2086%20164%2076%20148%22%2F%3E%3Cpath%20d%3D%22M126%20166%20C146%20160%20160%20148%20170%20132%22%2F%3E%3Cpath%20d%3D%22M118%20146%20C113%20128%20110%20114%20117%2098%22%2F%3E%3C%2Fg%3E%3Cg%20stroke-width%3D%225%22%3E%3Cpath%20d%3D%22M62%20200%20C54%20196%2046%20196%2036%20194%22%2F%3E%3Cpath%20d%3D%22M184%20182%20C192%20180%20200%20178%20210%20180%22%2F%3E%3Cpath%20d%3D%22M76%20148%20C70%20140%2062%20136%2054%20134%22%2F%3E%3Cpath%20d%3D%22M170%20132%20C178%20126%20186%20122%20196%20122%22%2F%3E%3Cpath%20d%3D%22M117%2098%20C110%2090%20104%2086%2096%2082%22%2F%3E%3Cpath%20d%3D%22M117%2098%20C126%2090%20136%2088%20146%2088%22%2F%3E%3C%2Fg%3E%3C%2Fg%3E%3Cg%20fill%3D%22%233B0A58%22%3E%3Ccircle%20cx%3D%2236%22%20cy%3D%22190%22%20r%3D%2215%22%2F%3E%3Ccircle%20cx%3D%2248%22%20cy%3D%22176%22%20r%3D%2212%22%2F%3E%3Ccircle%20cx%3D%2230%22%20cy%3D%22200%22%20r%3D%2210%22%2F%3E%3Ccircle%20cx%3D%22206%22%20cy%3D%22160%22%20r%3D%2215%22%2F%3E%3Ccircle%20cx%3D%22214%22%20cy%3D%22176%22%20r%3D%2212%22%2F%3E%3Ccircle%20cx%3D%22200%22%20cy%3D%22148%22%20r%3D%2211%22%2F%3E%3Ccircle%20cx%3D%2254%22%20cy%3D%22130%22%20r%3D%2215%22%2F%3E%3Ccircle%20cx%3D%2268%22%20cy%3D%22142%22%20r%3D%2211%22%2F%3E%3Ccircle%20cx%3D%22196%22%20cy%3D%22120%22%20r%3D%2214%22%2F%3E%3Ccircle%20cx%3D%22182%22%20cy%3D%22132%22%20r%3D%2211%22%2F%3E%3Cellipse%20cx%3D%2298%22%20cy%3D%2286%22%20rx%3D%2220%22%20ry%3D%2217%22%2F%3E%3Ccircle%20cx%3D%22118%22%20cy%3D%2278%22%20r%3D%2219%22%2F%3E%3Cellipse%20cx%3D%22146%22%20cy%3D%2288%22%20rx%3D%2219%22%20ry%3D%2216%22%2F%3E%3Ccircle%20cx%3D%2286%22%20cy%3D%22110%22%20r%3D%2214%22%2F%3E%3Ccircle%20cx%3D%22158%22%20cy%3D%22112%22%20r%3D%2214%22%2F%3E%3Ccircle%20cx%3D%22120%22%20cy%3D%22104%22%20r%3D%2215%22%2F%3E%3Ccircle%20cx%3D%22104%22%20cy%3D%22120%22%20r%3D%2212%22%2F%3E%3Ccircle%20cx%3D%22138%22%20cy%3D%22118%22%20r%3D%2212%22%2F%3E%3Ccircle%20cx%3D%2272%22%20cy%3D%22124%22%20r%3D%2210%22%2F%3E%3Ccircle%20cx%3D%22176%22%20cy%3D%22150%22%20r%3D%2212%22%2F%3E%3C%2Fg%3E%3C%2Fsvg%3E") no-repeat center 8vh;
      background-size:min(500px,78vw) auto; }
    /* dark mode: the dark-purple silhouette would vanish on a dark bg, so brighten it */
    html[data-theme="dark"] body::before { opacity:.16; filter:brightness(2.8) saturate(1.2); }
    .node__name { font-family:"Cinzel",serif; font-weight:700; letter-spacing:.01em; }
    .node__years { font-size:.68rem; color:#7a6a8a; }
    .node.dec .node__name::after { content:" ✝"; color:#b98bdd; font-size:.75em; }
    /* couple names on the gold ribbon */
    .ribbon .node .node__name { font-size:clamp(1rem,3.5vw,1.3rem); font-weight:700; color:#3a2a00; }
    .ribbon .node .node__photo { width:36px; height:36px; }
    /* child heart atop a column */
    .heart { flex-direction:column; align-items:center; gap:.12rem; }
    .heart::before { content:"♥"; color:var(--gold-soft); font-size:.85rem; line-height:1; }
    .heart .node__name { font-size:1rem; color:#fff; text-align:center; }
    .heart .node__years { color:#e9dcff; }
    .heart .node__photo { width:44px; height:44px; }
    .col__spouse .node__name { font-size:.8rem; color:#e9dcff; }
    /* descendant pills — laid side by side within a branch, wrapping as needed */
    .desc { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:.35rem; justify-content:center; }
    .desc li { margin:0; }
    .desc .desc { flex-basis:100%; margin-top:.2rem; margin-left:.5rem; border-left:2px dotted #d9c6ec; padding-left:.5rem; justify-content:flex-start; }
    .pill { background:#efe6f7; border:1px solid rgba(109,40,168,.25); border-radius:999px; padding:.2rem .55rem; }
    .pill .node__name { font-size:.86rem; font-weight:700; color:#34104f; }
    .pill .node__photo { width:22px; height:22px; }

    /* ---- Spouses / exes: current spouse sits next to the person; other ---- */
    /* ---- parents are noted on each child via .momtag ------------------- */
    .momtag { font-family:"Cinzel",serif; font-size:.6rem; letter-spacing:.03em; text-transform:uppercase;
      color:#8a6a00; margin-bottom:.05rem; line-height:1.1; }
    .col__head .momtag { color:var(--gold-soft); }
    .badge { display:inline-block; font-family:"Cinzel",serif; font-size:.58rem; letter-spacing:.04em; text-transform:uppercase;
      background:#efe0c4; color:#7a5a12; border:1px solid #d9c08a; border-radius:999px; padding:.03rem .4rem; vertical-align:middle; margin-left:.15rem; }
    .ribbon .badge { background:#3a2a00; color:var(--gold-soft); border-color:#b9892a; }
    .addkidli { list-style:none; margin:.3rem 0 .1rem; text-align:center; }
    .addkid { font:inherit; font-family:"Cinzel",serif; font-size:.68rem; letter-spacing:.03em; cursor:pointer;
      background:#fff; color:var(--purple-600); border:1px dashed var(--purple-600); border-radius:999px; padding:.12rem .6rem; }
    .addkid:hover { background:var(--purple-600); color:#fff; }
    .subbanner .addkid { font-size:.72rem; }

    /* ---- Modal ---- */
    .modal { position:fixed; inset:0; background:rgba(20,4,36,.6); display:flex; align-items:center; justify-content:center; z-index:60; padding:1rem; }
    .sheet { background:#fff; border-radius:18px; width:100%; max-width:440px; max-height:88vh; overflow:auto; box-shadow:var(--shadow); }
    .sheet__head { background:linear-gradient(160deg,var(--purple-900),var(--purple-600)); color:#fff; padding:1.1rem 1.3rem; position:sticky; top:0; }
    .sheet__head h2 { font-family:"Cinzel",serif; margin:.1rem 0; font-size:1.2rem; }
    .sheet__head .x { position:absolute; top:.8rem; right:1rem; background:transparent; border:0; color:#fff; font-size:1.3rem; cursor:pointer; }
    .sheet__body { padding:1.2rem 1.3rem 1.5rem; }
    .kv { margin:.3rem 0; } .kv b { font-family:"Cinzel",serif; color:var(--purple-800); }
    .sheet .btn { margin:.3rem .3rem 0 0; }
    .field { display:block; margin:.8rem 0; }
    .field span { font-family:"Cinzel",serif; font-size:.8rem; display:block; margin-bottom:.3rem; color:var(--purple-800); }
    .field input, .field select, .field textarea { width:100%; padding:.65rem .8rem; border-radius:10px; border:1px solid rgba(109,40,168,.3); font:inherit; font-family:Georgia,serif; }
    .field.row2 { display:grid; grid-template-columns:1fr 1fr; gap:.7rem; }
    .msg { min-height:1.2em; font-family:"Cinzel",serif; margin-top:.6rem; }
    .msg.ok { color:#1b6b1b; } .msg.err { color:#b11; }
    .center { text-align:center; }
    .state { max-width:460px; margin:3rem auto; text-align:center; padding:0 1rem; }

<body>
  <div class="topbar">
    <div>
      <div class="script">Miller Family Tree</div>
      <div class="sub">DIFFERENT GENERATIONS · ONE FAMILY</div>
    </div>
    <div><a class="home" href="photos.html">📸 Photos</a> &nbsp; <a class="home" href="event.html">🎉 Events</a> &nbsp; <a class="home" href="board.html">📝 Posts</a> &nbsp; <a class="home" href="chat.html">💬 Chat</a> &nbsp; <a class="home" href="feedback.html">✍️ Feedback</a> &nbsp; <a class="home" href="login.html">My Account</a></div>
  </div>

  <div id="app">
    <div class="state"><p>Loading the family tree…</p></div>
  </div>

  <div id="modal-root"></div>

  <script src="assets/js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/supabase-client.js"></script>
  <script src="assets/js/notify.js"></script>
  <script>
    const app = document.getElementById("app");
    const modalRoot = document.getElementById("modal-root");
    const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

    let ME = null;
    let PERSONS = [], BYID = {}, PARTNERS_OF = {}, CHILDREN = {}, PHOTO = {};
    let CAN_EDIT = false;

    // ---- View mode (TEST): "condensed" = branch cards + drill-down; "classic" = full tree ----
    let VIEW = "condensed";
    try { VIEW = localStorage.getItem("millerTreeView") || "condensed"; } catch (_) {}
    let DRILL = null;   // the branch (root person) being viewed, or null for the overview/classic
    const HISTORY = [];           // stack of previous DRILL values, for the Back button
    const EXPANDED = new Set();   // person ids whose collapsed sub-tree is expanded inline
    let DRILLABLE_IDS = new Set(); // person ids rendered with a hidden sub-tree — clicking their name opens it
    function drillTo(id) { HISTORY.push(DRILL); DRILL = id; renderTree(); window.scrollTo(0, 0); }
    // After an inline expand/collapse re-render, keep the view anchored on that person's
    // card (both the horizontal column scroll and the page), so you don't have to scroll back.
    function scrollToPerson(id) {
      try {
        const sel = (window.CSS && CSS.escape) ? CSS.escape(id) : id;
        const el = document.querySelector('.node[data-id="' + sel + '"]');
        if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", inline: "center" });
      } catch (_) {}
    }
    function drillBack() { DRILL = HISTORY.length ? HISTORY.pop() : null; renderTree(); window.scrollTo(0, 0); }

    // ---- Online-now avatars on tree nodes ----
    let ONLINE = new Set();       // tree person_ids whose member is active now
    let ONLINE_TIMER = null;
    function treeInitials(name) {
      const p = String(name || "?").trim().split(/\s+/);
      return ((p[0] || "")[0] || "?").toUpperCase() + (p.length > 1 ? (p[p.length - 1][0] || "").toUpperCase() : "");
    }
    function avColor(name) {
      let h = 0; const s = String(name || "?");
      for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
      return "hsl(" + h + ",55%,42%)";
    }
    // Refresh who's shown as "online now" — on person nodes (classic/drill)
    // AND on branch cards (condensed overview), in-place (no full re-render).
    async function refreshOnline() {
      try {
        if (!MillerDB.whoIsOnline) return;
        const { data } = await MillerDB.whoIsOnline();
        const rows = (data || []).filter((u) => u.person_id);
        ONLINE = new Set(rows.map((u) => u.person_id));
        const NAME = {}, AVPATH = {};
        rows.forEach((u) => { NAME[u.person_id] = u.full_name; if (u.avatar_url) AVPATH[u.person_id] = u.avatar_url; });
        const nameOf = (pid) => NAME[pid] || (BYID[pid] && BYID[pid].full_name) || "?";

        // resolve signed URLs for any avatars among the online set
        let URL = {};
        const paths = Object.values(AVPATH);
        if (paths.length && MillerDB.signedUrls) {
          const map = await MillerDB.signedUrls(paths);
          for (const pid in AVPATH) if (map[AVPATH[pid]]) URL[pid] = map[AVPATH[pid]];
        }
        // paint an avatar element: photo if available, else colored initials
        const paint = (el, pid) => {
          if (URL[pid]) { el.textContent = ""; el.style.background = "#fff center/cover no-repeat url('" + URL[pid] + "')"; }
          else { el.textContent = treeInitials(nameOf(pid)); el.style.background = avColor(nameOf(pid)); }
        };

        // person nodes
        document.querySelectorAll(".node[data-id]").forEach((btn) => {
          const id = btn.dataset.id, on = ONLINE.has(id);
          let av = btn.querySelector(".node__av");
          if (on) {
            if (!av) {
              av = document.createElement("span");
              av.className = "node__av"; av.title = "Online now";
              const photo = btn.querySelector(".node__photo");
              btn.insertBefore(av, photo ? photo.nextSibling : btn.firstChild);
            }
            paint(av, id);
          } else if (av) { av.remove(); }
        });

        // branch cards: show mini-avatars of anyone online within that branch
        document.querySelectorAll(".branchcard[data-drill]").forEach((card) => {
          const rid = card.dataset.drill, desc = descendantsOf(rid);
          const inBranch = rows.map((u) => u.person_id).filter((pid) => pid === rid || desc[pid]);
          let live = card.querySelector(".bc__live");
          if (inBranch.length) {
            if (!live) { live = document.createElement("span"); live.className = "bc__live"; card.appendChild(live); }
            live.textContent = "";
            inBranch.slice(0, 3).forEach((pid) => { const s = document.createElement("span"); s.className = "bc__liveav"; paint(s, pid); live.appendChild(s); });
            const t = document.createElement("span"); t.className = "bc__livetxt"; t.textContent = inBranch.length + " online"; live.appendChild(t);
          } else if (live) { live.remove(); }
        });
      } catch (_) {}
    }

    async function loadPhotos() {
      PHOTO = {};
      const withPhoto = PERSONS.filter((p) => p.photo_url);
      await Promise.all(withPhoto.map(async (p) => { PHOTO[p.id] = await MillerDB.signedUrl(p.photo_url); }));
    }

    function yearsLine(p) {
      const b = MillerDB.fmtDate(p.birth_year, p.birth_month, p.birth_day);
      const d = MillerDB.fmtDate(p.death_year, p.death_month, p.death_day);
      if (b && d) return b + " – " + d;
      if (b) return "b. " + b;
      if (d) return "d. " + d;
      return "";
    }

    function buildMaps() {
      BYID = {}; PARTNER = {}; CHILDREN = {};
      PERSONS.forEach(p => { BYID[p.id] = p; });
      PERSONS.forEach(p => {
        if (p.father_id) (CHILDREN[p.father_id] = CHILDREN[p.father_id] || []).push(p);
        if (p.mother_id) (CHILDREN[p.mother_id] = CHILDREN[p.mother_id] || []).push(p);
      });
    }
    function applyPartners(partners) {
      PARTNERS_OF = {};
      (partners || []).forEach(pr => {
        (PARTNERS_OF[pr.person_a] = PARTNERS_OF[pr.person_a] || []).push({ id: pr.person_b, status: pr.status });
        (PARTNERS_OF[pr.person_b] = PARTNERS_OF[pr.person_b] || []).push({ id: pr.person_a, status: pr.status });
      });
    }
    // the OTHER parent of a child, given one parent
    function otherParent(child, id) {
      if (child.father_id === id) return child.mother_id || null;
      if (child.mother_id === id) return child.father_id || null;
      return null;
    }
    // All of a person's unions — one per spouse/ex AND per co-parent of a child —
    // each carrying that union's children. This is what lets one parent have
    // several mothers/fathers for their kids, grouped under each spouse.
    function unionsFor(id) {
      const statusOf = {};
      (PARTNERS_OF[id] || []).forEach(pr => { if (!(pr.id in statusOf)) statusOf[pr.id] = pr.status; });
      const byOther = {};
      (CHILDREN[id] || []).forEach(k => {
        const o = otherParent(k, id) || "";
        (byOther[o] = byOther[o] || []).push(k);
      });
      const groups = [], seen = {};
      Object.keys(byOther).forEach(o => {
        const kids = byOther[o].slice().sort((a, b) => (a.birth_year || 9999) - (b.birth_year || 9999));
        groups.push({ partnerId: o || null, status: o ? (statusOf[o] || null) : null, kids });
        if (o) seen[o] = 1;
      });
      // spouses / exes with no recorded children are still shown
      (PARTNERS_OF[id] || []).forEach(pr => {
        if (!seen[pr.id] && BYID[pr.id]) { groups.push({ partnerId: pr.id, status: pr.status, kids: [] }); seen[pr.id] = 1; }
      });
      // unions that produced children first (oldest child first), childless unions after
      groups.sort((a, b) => {
        if (!a.kids.length && !b.kids.length) return 0;
        if (!a.kids.length) return 1;
        if (!b.kids.length) return -1;
        return (a.kids[0].birth_year || 9999) - (b.kids[0].birth_year || 9999);
      });
      return groups;
    }
    function effectivePartner(id) {
      const g = unionsFor(id);
      for (const u of g) if (u.partnerId) return u.partnerId;
      return null;
    }
    function statusBadge(status) {
      if (!status || status === "married") return "";
      const label = status === "divorced" ? "ex" : (status === "widowed" ? "✝ widowed" : esc(status));
      return ' <span class="badge">' + label + "</span>";
    }

    const rendered = {};
    const firstName = (n) => String(n || "").split(" ")[0];
    // A person's tree label: their nickname (if they chose to show it) else full name.
    const displayName = (p) => (p && p.show_nickname && p.nickname) ? p.nickname : (p ? (p.full_name || "") : "");
    // Show this many generations per view; deeper branches collapse into drillable sub-trees.
    const MAXGEN = 4;
    function expandToggle(id, expanded) {
      const nm = esc(firstName(displayName(BYID[id])));
      return expanded
        ? '<button class="subtreebtn" data-collapse="' + id + '" title="Hide ' + nm + '’s children" aria-label="Hide ' + nm + '’s children">–</button>'
        : '<button class="subtreebtn" data-expand="' + id + '" title="Show ' + nm + '’s children" aria-label="Show ' + nm + '’s children">＋</button>';
    }

    function personNode(p, variant) {
      const dec = p.is_living === false ? " dec" : "";
      const photo = PHOTO[p.id] ? '<img class="node__photo" src="' + PHOTO[p.id] + '" alt="" />' : "";
      const yrs = yearsLine(p);
      if (variant === "ribbon") {
        return '<button class="node' + dec + '" data-id="' + p.id + '">' + photo +
          '<span class="node__name">' + esc(displayName(p)) + "</span></button>";
      }
      if (variant === "heart") {
        return '<button class="node heart' + dec + '" data-id="' + p.id + '">' + photo +
          '<span class="node__name">' + esc(displayName(p)) + "</span>" +
          (yrs ? '<span class="node__years">' + yrs + "</span>" : "") + "</button>";
      }
      // pill
      return '<button class="node pill' + dec + '" data-id="' + p.id + '">' + photo +
        '<span class="node__name">' + esc(displayName(p)) + "</span></button>";
    }

    // Compact card for a founding family in the condensed overview.
    function branchCard(r) {
      const sp = primarySpouse(r.id);
      const count = descendantCount(r.id);
      const photo = PHOTO[r.id] ? '<img class="bc__photo" src="' + PHOTO[r.id] + '" alt="" />' : '<span class="bc__photo bc__noimg">🌳</span>';
      const names = esc(displayName(r)) + (sp ? " &amp; " + esc(displayName(sp)) : "");
      return '<button class="branchcard" data-drill="' + r.id + '">' + photo +
        '<span class="bc__name">' + names + "</span>" +
        '<span class="bc__count">' + count + " descendant" + (count === 1 ? "" : "s") + "</span>" +
        '<span class="bc__go">View branch →</span></button>';
    }

    function descendantCount(id, seen) {
      seen = seen || {}; if (seen[id]) return 0; seen[id] = 1;
      let n = 0;
      (CHILDREN[id] || []).forEach((k) => { n += 1 + descendantCount(k.id, seen); });
      return n;
    }
    // set of all descendant ids of `id` (used to keep parent dropdowns loop-free)
    function descendantsOf(id) {
      const out = {}, stack = (CHILDREN[id] || []).slice();
      while (stack.length) {
        const k = stack.pop();
        if (out[k.id]) continue;
        out[k.id] = 1;
        (CHILDREN[k.id] || []).forEach((c) => stack.push(c));
      }
      return out;
    }

    // "＋ add child" affordance on a branch (active members only)
    function addKidBtn(parentId, coId) {
      if (!CAN_EDIT) return "";
      return '<button class="addkid" data-p="' + parentId + '" data-co="' + (coId || "") + '">＋ add child</button>';
    }

    // The current / final spouse — the one shown NEXT TO the person (not exes).
    // Exes and other co-parents are not "the spouse"; they're noted on each child.
    function primarySpouse(id) {
      const list = (PARTNERS_OF[id] || []).filter((pr) => BYID[pr.id] && pr.status !== "divorced");
      if (!list.length) return null;
      const rank = { married: 0, partner: 1, widowed: 2 };
      list.sort((a, b) => (rank[a.status] == null ? 5 : rank[a.status]) - (rank[b.status] == null ? 5 : rank[b.status]));
      return list[0];
    }
    // "mother: X" / "father: X" noted by a child, when that parent is NOT the
    // person's current spouse (i.e. the child is from another relationship).
    function momLabel(child, parentId, primaryId) {
      const o = otherParent(child, parentId);
      if (!o || o === primaryId || !BYID[o]) return "";
      const role = BYID[parentId] && BYID[parentId].gender === "female" ? "father" : "mother";
      return '<div class="momtag">' + role + ": " + esc(BYID[o].full_name) + "</div>";
    }
    // All of a person's children (every relationship), oldest first, each tagged
    // with the other parent when it differs from the person's current spouse.
    function kidsList(parentId, seen, gen) {
      gen = gen || 3;                       // kids listed here are the 3rd generation of the current view
      seen = seen || {}; if (seen[parentId]) return ""; seen[parentId] = 1; // guard against bad parent loops
      const kids = (CHILDREN[parentId] || []).slice().sort((a, b) => (a.birth_year || 9999) - (b.birth_year || 9999));
      if (!kids.length) return "";
      const kp = primarySpouse(parentId); const primaryId = kp ? kp.id : null;
      let html = '<ul class="desc">';
      kids.forEach((k) => {
        rendered[k.id] = 1;
        const skp = primarySpouse(k.id); const sp = skp ? BYID[skp.id] : null; if (sp) rendered[sp.id] = 1;
        let deeper;
        if (gen >= MAXGEN) {
          if (!(CHILDREN[k.id] || []).length) {
            deeper = "";
          } else if (EXPANDED.has(k.id)) {
            // expanded inline: show the next generation right here (one level at a time)
            DRILLABLE_IDS.add(k.id);
            deeper = '<div class="subtreewrap">' + expandToggle(k.id, true) + "</div>" + kidsList(k.id, seen, gen + 1);
          } else {
            // collapsed: clicking this person's name opens their full branch; mark descendants
            // rendered so they don't fall into "Other family members"
            DRILLABLE_IDS.add(k.id);
            const d = descendantsOf(k.id);
            for (const id in d) { rendered[id] = 1; const kk = BYID[id]; if (kk) { if (kk.father_id) rendered[kk.father_id] = 1; if (kk.mother_id) rendered[kk.mother_id] = 1; } }
            deeper = '<div class="subtreewrap">' + expandToggle(k.id, false) + "</div>";
          }
        } else {
          deeper = kidsList(k.id, seen, gen + 1);
        }
        html += "<li>" + momLabel(k, parentId, primaryId) + personNode(k, "pill") +
          (sp ? ' <span class="amp" style="font-size:.75rem">♥</span> ' + personNode(sp, "pill") + statusBadge(skp.status) : "") +
          deeper + "</li>";
      });
      const btn = addKidBtn(parentId, primaryId || "");
      if (btn) html += '<li class="addkidli">' + btn + "</li>";
      return html + "</ul>";
    }

    function columnFor(childId, parentId, parentPrimaryId) {
      const child = BYID[childId];
      rendered[childId] = 1;
      const kp = primarySpouse(childId); const spouse = kp ? BYID[kp.id] : null; if (spouse) rendered[spouse.id] = 1;
      const kids = CHILDREN[childId] || [];
      let body = kids.length ? kidsList(childId) : '<div class="col__empty">— no children recorded —</div>';
      if (CAN_EDIT && !kids.length) body += '<div class="addkidli">' + addKidBtn(childId, kp ? kp.id : "") + "</div>";
      return '<div class="col">' +
        '<div class="col__head">' +
          (typeof parentId !== "undefined" ? momLabel(child, parentId, parentPrimaryId) : "") +
          personNode(child, "heart") +
          (spouse ? '<div class="col__spouse"><span class="amp">♥</span> ' + personNode(spouse, "pill") + statusBadge(kp.status) + "</div>" : "") +
        "</div>" +
        '<div class="col__body"><div class="col__title">' + esc(firstName(displayName(child))) + "'s children</div>" +
          body +
        "</div></div>";
    }

    function coupleRibbon(aId, bId, status) {
      let a = BYID[aId]; let b = bId && BYID[bId] ? BYID[bId] : null;
      if (b && a.gender === "female" && b.gender === "male") { const t = a; a = b; b = t; } // husband first, like the poster
      return '<div class="ribbon">' + personNode(a, "ribbon") +
        (b ? '<span class="amp">♥</span>' + personNode(b, "ribbon") + statusBadge(status) : "") + "</div>";
    }

    function familyBlock(rootId) {
      rendered[rootId] = 1;
      const root = BYID[rootId];
      const kp = primarySpouse(rootId); const spouse = kp ? BYID[kp.id] : null; if (spouse) rendered[spouse.id] = 1;
      const primaryId = kp ? kp.id : null;
      const kids = (CHILDREN[rootId] || []).slice().sort((a, b) => (a.birth_year || 9999) - (b.birth_year || 9999));
      let html = '<div class="family">' + coupleRibbon(rootId, primaryId, kp ? kp.status : null);
      if (kids.length) {
        html += '<div class="subbanner"><span>' + (spouse
          ? esc(firstName(displayName(root))) + " &amp; " + esc(firstName(displayName(spouse))) + "’s " + kids.length + (kids.length === 1 ? " child" : " children")
          : "Their " + kids.length + (kids.length === 1 ? " child" : " children")) + "</span></div>";
        html += kids.length > 3 ? '<div class="scrollhint">← swipe sideways to see all ' + kids.length + " →</div>" : "";
        html += '<div class="cols">' + kids.map((k) => columnFor(k.id, rootId, primaryId)).join("") + "</div>";
      } else if (spouse && CAN_EDIT) {
        html += '<div class="subbanner"><span>' + addKidBtn(rootId, spouse.id) + "</span></div>";
      }
      return html + "</div>";
    }

    function renderTree() {
      for (const k in rendered) delete rendered[k];
      DRILLABLE_IDS = new Set();
      CAN_EDIT = ME.status === "active";
      let roots = PERSONS.filter((p) => !p.father_id && !p.mother_id).filter((p) => {
        const pid = effectivePartner(p.id);
        if (!pid || !BYID[pid]) return true;
        const sp = BYID[pid];
        return !sp.father_id && !sp.mother_id; // exclude married-in spouses
      });
      const withKids = roots.filter((r) => descendantCount(r.id) > 0).sort((a, b) => descendantCount(b.id) - descendantCount(a.id));
      const elders = roots.filter((r) => descendantCount(r.id) === 0); // standalone elders/individuals

      // ----- helpers shared by both views -----
      const eldersRibbons = () => elders.map((r) => {
        const kp = primarySpouse(r.id); const pid = kp ? kp.id : null;
        return '<div class="family">' + coupleRibbon(r.id, pid, kp ? kp.status : null) + "</div>";
      }).join("");
      // people not inside any founding branch (computed without touching `rendered`)
      const coverageLeftovers = () => {
        const covered = {};
        withKids.concat(elders).forEach((r) => {
          covered[r.id] = 1; const sp = primarySpouse(r.id); if (sp) covered[sp.id] = 1;
          const desc = descendantsOf(r.id);
          for (const id in desc) { covered[id] = 1; const k = BYID[id]; if (k) { if (k.father_id) covered[k.father_id] = 1; if (k.mother_id) covered[k.mother_id] = 1; } }
        });
        return PERSONS.filter((p) => !covered[p.id]);
      };
      const leftoversHtml = (list) => list.length
        ? '<div class="family"><div class="subbanner"><span>Other family members</span></div><div class="cols">' +
            list.map((p) => '<div class="col"><div class="col__head">' + personNode(p, "heart") + "</div></div>").join("") + "</div></div>"
        : "";

      let body = "";
      if (DRILL && BYID[DRILL]) {
        // focused view on one person's branch — works from either Classic or Condensed
        const r = BYID[DRILL];
        const back = '<button class="btn btn--sm btn--outline treeback">← Back</button>';
        if (descendantCount(r.id) > 0) body = back + familyBlock(r.id);
        else { const kp = primarySpouse(r.id); body = back + '<div class="family">' + coupleRibbon(r.id, kp ? kp.id : null, kp ? kp.status : null) + "</div>"; }
      } else if (VIEW === "condensed") {
        DRILL = null;
        // Eldest known ancestor pinned at the top (Levi Miller), with all branches beneath him.
        const topA = PERSONS.find((p) => /^\s*levi\b/i.test(p.full_name || "") && !p.father_id && !p.mother_id)
          || (withKids.length === 1 ? withKids[0] : null);
        const tapHint = '<p class="hint" style="text-align:center;margin:.4rem 0 .2rem">Tap a family to open that branch.</p>';
        if (topA) {
          const sp = primarySpouse(topA.id);
          const kids = (CHILDREN[topA.id] || []).slice().sort((a, b) => (a.birth_year || 9999) - (b.birth_year || 9999));
          const others = withKids.filter((r) => r.id !== topA.id && (!sp || r.id !== sp.id));
          const cards = kids.concat(others).map(branchCard).join("");
          const extraElders = elders.filter((r) => r.id !== topA.id && (!sp || r.id !== sp.id))
            .map((r) => { const kp = primarySpouse(r.id); return '<div class="family">' + coupleRibbon(r.id, kp ? kp.id : null, kp ? kp.status : null) + "</div>"; }).join("");
          body = '<div class="ancestor"><div class="ancestor__label">🌳 Our eldest known ancestor</div>' +
              '<div class="family">' + coupleRibbon(topA.id, sp ? sp.id : null, sp ? sp.status : null) + "</div></div>" +
            (cards ? tapHint + '<div class="branchgrid">' + cards + "</div>" : '<p class="hint" style="text-align:center">No branches linked under him yet.</p>') +
            extraElders + leftoversHtml(coverageLeftovers());
        } else {
          body = tapHint + '<div class="branchgrid">' + withKids.map(branchCard).join("") + "</div>" +
            eldersRibbons() + leftoversHtml(coverageLeftovers());
        }
      } else {
        // classic full tree
        let blocks = "";
        elders.forEach((r) => {
          if (rendered[r.id]) return; rendered[r.id] = 1;
          const kp = primarySpouse(r.id); const pid = kp ? kp.id : null; if (pid) rendered[pid] = 1;
          blocks += '<div class="family">' + coupleRibbon(r.id, pid, kp ? kp.status : null) + "</div>";
        });
        withKids.forEach((r) => { if (!rendered[r.id]) blocks += familyBlock(r.id); });
        const leftovers = PERSONS.filter((p) => !rendered[p.id]);
        let eldersHtml = "";
        if (leftovers.length) eldersHtml = '<div class="family"><div class="subbanner"><span>Other family members</span></div><div class="cols">' +
          leftovers.map((p) => { rendered[p.id] = 1; return '<div class="col"><div class="col__head">' + personNode(p, "heart") + "</div></div>"; }).join("") + "</div></div>";
        body = blocks + eldersHtml;
      }

      const reviewer = ME.role === "admin" || ME.role === "elder";
      app.innerHTML =
        '<div class="tree-header"><div class="doves">🕊️ 🌳 🕊️</div><h1>The Miller Family Tree</h1>' +
          '<div class="tagline">Different Generations ~ Same Family ~ One Love</div></div>' +
        '<div class="toolbar">' +
          '<span class="hint">Tap a name for details' + (ME.status === "active" ? " or to add relatives" : "") + "; a name with a ＋ opens its full branch.</span>" +
          '<input id="treesearch" class="treesearch" list="treenames" placeholder="🔍 Search a name…" autocomplete="off" />' +
          '<datalist id="treenames">' + PERSONS.map((p) => '<option value="' + esc(displayName(p)) + '"></option>').join("") + "</datalist>" +
          '<button class="btn btn--sm btn--outline viewtoggle">' + (VIEW === "condensed" ? "Classic view" : "Condensed view") + "</button>" +
          (reviewer ? '<a class="btn btn--sm btn--gold" href="admin.html#tree">Review submissions</a>' : "") +
        "</div>" +
        '<div class="families">' + body + "</div>";

      refreshOnline();
      if (!ONLINE_TIMER) ONLINE_TIMER = setInterval(() => {
        if (document.visibilityState === "visible") refreshOnline();
      }, 25000);

      const srch = document.getElementById("treesearch");
      if (srch) {
        const go = () => doTreeSearch(srch.value);
        srch.addEventListener("change", go);
        srch.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); go(); } });
      }
    }

    function doTreeSearch(q) {
      q = String(q || "").trim().toLowerCase();
      if (!q) return;
      const hit =
        PERSONS.find((p) => String(displayName(p)).toLowerCase() === q) ||
        PERSONS.find((p) => String(p.full_name || "").toLowerCase() === q) ||
        PERSONS.find((p) => String(displayName(p)).toLowerCase().indexOf(q) !== -1) ||
        PERSONS.find((p) => String(p.full_name || "").toLowerCase().indexOf(q) !== -1) ||
        PERSONS.find((p) => String(p.nickname || "").toLowerCase().indexOf(q) !== -1);
      if (!hit) return;
      drillTo(hit.id);         // drill into that person's branch…
      openDetail(hit.id);      // …and open their card
    }

    /* ---------- interactions ---------- */
    app.addEventListener("click", (e) => {
      const vt = e.target.closest(".viewtoggle");
      if (vt) { VIEW = VIEW === "condensed" ? "classic" : "condensed"; try { localStorage.setItem("millerTreeView", VIEW); } catch (_) {} DRILL = null; HISTORY.length = 0; renderTree(); window.scrollTo(0, 0); return; }
      const bc = e.target.closest(".branchcard");
      if (bc) { drillTo(bc.dataset.drill); return; }
      const bk = e.target.closest(".treeback");
      if (bk) { drillBack(); return; }
      const ex = e.target.closest("[data-expand]");
      if (ex) { const id = ex.dataset.expand; EXPANDED.add(id); renderTree(); scrollToPerson(id); return; }
      const co = e.target.closest("[data-collapse]");
      if (co) { const id = co.dataset.collapse; EXPANDED.delete(id); renderTree(); scrollToPerson(id); return; }
      const add = e.target.closest(".addkid");
      if (add) { e.preventDefault(); return openAddChild(BYID[add.dataset.p], add.dataset.co || ""); }
      const n = e.target.closest(".node");
      if (n) {
        // a name with a hidden sub-tree opens the full branch; otherwise show the detail card
        if (DRILLABLE_IDS.has(n.dataset.id)) drillTo(n.dataset.id);
        else openDetail(n.dataset.id);
      }
    });

    function closeModal() { modalRoot.innerHTML = ""; }
    function openModal(headTitle, bodyHtml) {
      modalRoot.innerHTML =
        '<div class="modal" id="ov"><div class="sheet">' +
          '<div class="sheet__head"><button class="x" id="mx">✕</button><h2>' + headTitle + "</h2></div>" +
          '<div class="sheet__body">' + bodyHtml + "</div>" +
        "</div></div>";
      document.getElementById("mx").onclick = closeModal;
      document.getElementById("ov").onclick = (ev) => { if (ev.target.id === "ov") closeModal(); };
    }

    function parentLine(p) {
      const f = p.father_id && BYID[p.father_id] ? BYID[p.father_id].full_name : null;
      const m = p.mother_id && BYID[p.mother_id] ? BYID[p.mother_id].full_name : null;
      if (!f && !m) return "";
      return '<div class="kv"><b>Parents:</b> ' + esc([f, m].filter(Boolean).join(" & ")) + "</div>";
    }

    function openDetail(id) {
      const p = BYID[id];
      if (!p) return;
      const spouses = (PARTNERS_OF[id] || []).filter((u) => BYID[u.id]);
      const canEdit = ME.status === "active";
      const canRemove = ME.role === "admin" || ME.role === "elder";
      let body =
        (PHOTO[id] ? '<img src="' + PHOTO[id] + '" alt="" style="width:120px;height:120px;object-fit:cover;border-radius:12px;border:2px solid var(--gold);display:block;margin:0 0 .9rem;" />' : "") +
        (yearsLine(p) ? '<div class="kv"><b>Years:</b> ' + yearsLine(p) + "</div>" : "") +
        '<div class="kv"><b>Status:</b> ' + (p.is_living === false ? "In loving memory ✝" : "Living") + "</div>" +
        (p.maiden_name ? '<div class="kv"><b>Maiden name:</b> ' + esc(p.maiden_name) + "</div>" : "") +
        parentLine(p) +
        (spouses.length
          ? '<div class="kv"><b>Spouse' + (spouses.length > 1 ? "s" : "") + ':</b> ' +
            spouses.map((u) => esc(BYID[u.id].full_name) +
              (u.status && u.status !== "married" ? " (" + (u.status === "divorced" ? "ex" : esc(u.status)) + ")" : "")).join(", ") + "</div>"
          : "") +
        (p.notes ? '<div class="kv"><b>Notes:</b> ' + esc(p.notes) + "</div>" : "");
      if (canEdit) {
        body += '<hr style="border:0;border-top:1px solid #eee;margin:1rem 0" />' +
          '<button class="btn btn--sm btn--gold" data-act="edit">Suggest an edit</button>' +
          '<button class="btn btn--sm btn--outline" data-act="child">Add a child</button>' +
          '<button class="btn btn--sm btn--outline" data-act="parent">Add a parent</button>' +
          '<button class="btn btn--sm btn--outline" data-act="sibling">Add a sibling</button>' +
          '<button class="btn btn--sm btn--outline" data-act="spouse">Add a spouse / ex</button>' +
          '<p class="hint" style="margin-top:.6rem">Changes are reviewed by a family elder before they appear.</p>';
      }
      if (canRemove) {
        body += '<hr style="border:0;border-top:1px solid #eee;margin:1rem 0" />' +
          '<button class="btn btn--sm" data-act="remove" style="background:#b11;color:#fff;border-color:#b11;">🗑 Remove from tree</button>' +
          '<p class="hint" style="margin-top:.4rem;color:#8a1b1b">Admins only. Permanently removes this person. Any children stay on the tree but lose this parent link.</p>';
      }
      openModal(esc(p.full_name), body);
      if (canEdit) {
        modalRoot.querySelector('[data-act="edit"]').onclick = () => openEdit(p);
        modalRoot.querySelector('[data-act="child"]').onclick = () => openAddChild(p, "");
        modalRoot.querySelector('[data-act="parent"]').onclick = () => openAddParent(p);
        modalRoot.querySelector('[data-act="sibling"]').onclick = () => openAddSibling(p);
        modalRoot.querySelector('[data-act="spouse"]').onclick = () => openAddSpouse(p);
      }
      if (canRemove) {
        modalRoot.querySelector('[data-act="remove"]').onclick = () => openRemove(p);
      }
    }

    function openRemove(p) {
      const kids = CHILDREN[p.id] || [];
      const warn = kids.length
        ? "<p class='hint'>" + esc(firstName(p.full_name)) + " has <b>" + kids.length +
          (kids.length === 1 ? " child" : " children") + "</b> recorded. They will stay on the tree but will no longer show " +
          esc(firstName(p.full_name)) + " as a parent.</p>"
        : "";
      openModal("Remove " + esc(p.full_name) + "?",
        "<p>This permanently removes <b>" + esc(p.full_name) + "</b> from the family tree. This cannot be undone.</p>" +
        warn +
        '<div style="margin-top:1rem">' +
          '<button class="btn btn--sm" id="rm-yes" style="background:#b11;color:#fff;border-color:#b11;">Yes, remove permanently</button> ' +
          '<button class="btn btn--sm btn--outline" id="rm-no">Cancel</button>' +
        "</div><p class='msg' id='rm-m'></p>");
      document.getElementById("rm-no").onclick = () => openDetail(p.id);
      document.getElementById("rm-yes").onclick = async (ev) => {
        const btn = ev.currentTarget, msg = document.getElementById("rm-m");
        btn.disabled = true; btn.textContent = "Removing…";
        const { error } = await MillerDB.deletePerson(p.id);
        if (error) {
          btn.disabled = false; btn.textContent = "Yes, remove permanently";
          msg.textContent = "Could not remove: " + error.message; msg.className = "msg err"; return;
        }
        msg.textContent = "Removed."; msg.className = "msg ok";
        const [{ data: persons }, { data: partners }] = await Promise.all([MillerDB.listPersons(), MillerDB.listPartners()]);
        PERSONS = persons || []; buildMaps(); applyPartners(partners || []);
        await loadPhotos();
        renderTree();
        setTimeout(closeModal, 700);
      };
    }

    function personFields(prefill) {
      prefill = prefill || {};
      const g = prefill.gender || "";
      return '<label class="field"><span>Full name (first &amp; last)</span><input name="full_name" value="' + esc(prefill.full_name || "") + '" required /></label>' +
        '<label class="field"><span>Nickname (optional)</span><input name="nickname" value="' + esc(prefill.nickname || "") + '" placeholder="e.g. Bud, Junior" /></label>' +
        '<label class="field"><span>Show on the tree as</span><select name="show_nickname">' +
          '<option value="false"' + (prefill.show_nickname ? "" : " selected") + ">Full name</option>" +
          '<option value="true"' + (prefill.show_nickname ? " selected" : "") + ">Nickname</option></select></label>" +
        '<label class="field"><span>Birth date (DD/MM/YYYY)</span><input name="birth_date_str" inputmode="numeric" value="' + esc(MillerDB.fmtDate(prefill.birth_year, prefill.birth_month, prefill.birth_day)) + '" placeholder="e.g. 16/04/1975" /></label>' +
        '<label class="field"><span>Death date (DD/MM/YYYY — or just a year if the day & month are unknown)</span><input name="death_date_str" inputmode="numeric" value="' + esc(MillerDB.fmtDate(prefill.death_year, prefill.death_month, prefill.death_day)) + '" placeholder="(if applicable)" /></label>' +
        '<label class="field"><span>Maiden name (optional)</span><input name="maiden_name" value="' + esc(prefill.maiden_name || "") + '" /></label>' +
        '<label class="field"><span>Gender</span><select name="gender">' +
          ['','male','female','other'].map(o => '<option value="' + o + '"' + (g === o ? " selected" : "") + ">" + (o || "—") + "</option>").join("") +
        "</select></label>" +
        '<label class="field"><span>Living?</span><select name="is_living">' +
          '<option value="true"' + (prefill.is_living !== false ? " selected" : "") + ">Living</option>" +
          '<option value="false"' + (prefill.is_living === false ? " selected" : "") + ">In loving memory</option></select></label>" +
        '<label class="field"><span>Notes (optional)</span><textarea name="notes" rows="2">' + esc(prefill.notes || "") + "</textarea></label>";
    }
    function readForm(form) {
      const d = Object.fromEntries(new FormData(form).entries());
      const out = {};
      ["full_name","maiden_name","gender","notes"].forEach(k => { if (d[k] !== undefined && d[k] !== "") out[k] = d[k].trim(); });
      out.is_living = d.is_living === "false" ? false : true;
      // Nickname + display choice: always sent so a nickname can be set, changed, or cleared.
      out.nickname = (d.nickname || "").trim();
      out.show_nickname = d.show_nickname === "true" ? "true" : "false";
      // Birth / death dates: MM/DD/YYYY (or year-only). Year drives the month/day
      // keys so an edit that supplies a date fully controls them (see approve_submission).
      const b = MillerDB.parseDateStr(d.birth_date_str);
      const dd = MillerDB.parseDateStr(d.death_date_str);
      out.__dateError = b.error || dd.error || null;
      if (b.year)  { out.birth_year = b.year; out.birth_month = b.month || ""; out.birth_day = b.day || ""; }
      if (dd.year) { out.death_year = dd.year; out.death_month = dd.month || ""; out.death_day = dd.day || ""; }
      // Parent dropdowns (edit form): pass through even when blank so a parent
      // can be set, changed, or cleared. submitForm adds set_parents so the
      // backend treats these as authoritative (see approve_submission).
      ["father_id","mother_id"].forEach(k => { if (d[k] !== undefined) out[k] = d[k]; });
      return out;
    }

    function submitForm(kind, targetId, extra, form, msgEl) {
      const data = Object.assign(readForm(form), extra || {});
      if (data.__dateError) { msgEl.textContent = data.__dateError; msgEl.className = "msg err"; return; }
      delete data.__dateError;
      if (!data.full_name) { msgEl.textContent = "Please enter a name."; msgEl.className = "msg err"; return; }
      msgEl.textContent = "Submitting…"; msgEl.className = "msg";
      MillerDB.submitPerson({ kind, targetId, data }).then(({ error }) => {
        if (error) { msgEl.textContent = "Could not submit: " + error.message; msgEl.className = "msg err"; return; }
        msgEl.textContent = "Submitted! A family elder will review it.";
        msgEl.className = "msg ok";
        setTimeout(closeModal, 1600);
      });
    }

    // dropdown of people who may be a parent; `banned` is a set of ids to omit
    // (used to keep the edit form loop-free), current value preselected.
    function parentSelect(name, label, currentId, banned) {
      banned = banned || {};
      const opts = ['<option value="">— none —</option>'].concat(
        PERSONS.filter((x) => !banned[x.id])
          .slice().sort((a, b) => (a.full_name || "").localeCompare(b.full_name || ""))
          .map((x) => '<option value="' + x.id + '"' + (currentId === x.id ? " selected" : "") + ">" +
            esc(x.full_name) + (x.birth_year ? " (b. " + x.birth_year + ")" : "") + "</option>")
      );
      return '<label class="field"><span>' + label + "</span><select name=\"" + name + "\">" + opts.join("") + "</select></label>";
    }
    function openEdit(p) {
      const banned = descendantsOf(p.id); banned[p.id] = 1;
      const parents =
        '<p class="hint" style="margin:.4rem 0 -.2rem">Parents — set or change who this person belongs to (auto-filled with everyone on the tree):</p>' +
        parentSelect("father_id", "Father", p.father_id || "", banned) +
        parentSelect("mother_id", "Mother", p.mother_id || "", banned);
      openModal("Suggest an edit", '<form id="f">' + personFields(p) + parents +
        '<button class="btn btn--gold" type="submit">Submit for review</button><p class="msg" id="m"></p></form>');
      const f = document.getElementById("f");
      f.onsubmit = (e) => { e.preventDefault(); submitForm("edit", p.id, { set_parents: "1" }, f, document.getElementById("m")); };
    }
    function openAddChild(p, presetCoId) {
      if (!p) return;
      // Auto-fill: the person you tapped goes in their gender's slot; their
      // current spouse (or the preset co-parent) fills the other slot.
      let fatherDefault = "", motherDefault = "";
      if (p.gender === "female") motherDefault = p.id; else fatherDefault = p.id;
      const kp = primarySpouse(p.id);
      const otherId = presetCoId || (kp ? kp.id : "");
      const o = otherId ? BYID[otherId] : null;
      if (o) {
        if (o.gender === "male") { if (!fatherDefault) fatherDefault = o.id; else if (!motherDefault) motherDefault = o.id; }
        else { if (!motherDefault) motherDefault = o.id; else if (!fatherDefault) fatherDefault = o.id; }
      }
      const parents =
        '<p class="hint" style="margin:.4rem 0 -.2rem">Parents (auto-filled — change either if needed; leave “none” if a parent isn’t on the tree):</p>' +
        parentSelect("father_id", "Father", fatherDefault, {}) +
        parentSelect("mother_id", "Mother", motherDefault, {});
      openModal("Add a child of " + esc(p.full_name), '<form id="f">' + personFields({}) + parents +
        '<button class="btn btn--gold" type="submit">Submit for review</button><p class="msg" id="m"></p></form>');
      const f = document.getElementById("f");
      f.onsubmit = (e) => { e.preventDefault(); submitForm("add", null, {}, f, document.getElementById("m")); };
    }
    function openAddParent(p) {
      openModal("Add a parent of " + esc(p.full_name),
        '<form id="f">' +
          '<label class="field"><span>This parent is the…</span><select name="role"><option value="father">Father</option><option value="mother">Mother</option></select></label>' +
          personFields({}) +
          '<button class="btn btn--gold" type="submit">Submit for review</button><p class="msg" id="m"></p>' +
        "</form>");
      const f = document.getElementById("f");
      f.onsubmit = (e) => {
        e.preventDefault();
        const role = f.role.value === "mother" ? "mother" : "father";
        submitForm("add", null, { child_id: p.id, child_role: role }, f, document.getElementById("m"));
      };
    }
    function openAddSibling(p) {
      const hasParents = !!(p.father_id || p.mother_id);
      const note = hasParents
        ? '<p class="hint">They\'ll share ' + esc(firstName(p.full_name)) + "'s parents.</p>"
        : '<p class="hint">Siblings are linked by shared parents. ' + esc(firstName(p.full_name)) +
          " has no parents recorded yet, so this sibling will appear as a separate entry until you add their shared parents (use “Add a parent” on either of them).</p>";
      openModal("Add a sibling of " + esc(p.full_name),
        '<form id="f">' + note + personFields({}) +
        '<button class="btn btn--gold" type="submit">Submit for review</button><p class="msg" id="m"></p></form>');
      const f = document.getElementById("f");
      f.onsubmit = (e) => {
        e.preventDefault();
        submitForm("add", null, { father_id: p.father_id || "", mother_id: p.mother_id || "" }, f, document.getElementById("m"));
      };
    }
    function openAddSpouse(p) {
      const statusField = '<label class="field"><span>Relationship</span><select name="partner_status">' +
        '<option value="married">Married</option>' +
        '<option value="partner">Partner</option>' +
        '<option value="divorced">Ex (divorced / separated)</option>' +
        '<option value="widowed">Widowed</option>' +
        "</select></label>";
      openModal("Add " + esc(p.full_name) + "’s spouse / ex", '<form id="f">' + statusField + personFields({}) +
        '<button class="btn btn--gold" type="submit">Submit for review</button><p class="msg" id="m"></p></form>');
      const f = document.getElementById("f");
      f.onsubmit = (e) => { e.preventDefault(); submitForm("add", null, { partner_id: p.id, partner_status: f.partner_status.value }, f, document.getElementById("m")); };
    }

    /* ---------- init ---------- */
    (async function init() {
      if (!MillerDB.configured) { app.innerHTML = '<div class="state"><h2>Not connected yet</h2><p><a href="index.html">Back to the family page</a></p></div>'; return; }
      await new Promise(r => setTimeout(r, 250));
      const session = await MillerDB.getSession();
      if (!session) { location.href = "login.html"; return; }
      ME = await MillerDB.getProfile();
      if (!ME) { app.innerHTML = '<div class="state"><p>Finishing sign-in… <a href="tree.html">refresh</a>.</p></div>'; return; }
      if (ME.status !== "active") {
        app.innerHTML = '<div class="state"><h2>Almost there!</h2><p>Your access is pending approval. Once a family elder approves you, the tree will appear here.</p><p><a class="btn btn--gold" href="login.html">My Account</a></p></div>';
        return;
      }
      const [{ data: persons, error: e1 }, { data: partners, error: e2 }] = await Promise.all([MillerDB.listPersons(), MillerDB.listPartners()]);
      if (e1 || e2) { app.innerHTML = '<div class="state"><p>Could not load the tree. Please refresh.</p></div>'; return; }
      PERSONS = persons || []; buildMaps(); applyPartners(partners || []);
      if (!PERSONS.length) { app.innerHTML = '<div class="state"><p>The tree is empty.</p></div>'; return; }
      await loadPhotos();
      renderTree();
    })();
  </script>
</body>
</html>
